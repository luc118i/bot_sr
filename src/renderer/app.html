<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'" />
  <title>SR_dados</title>
  <link rel="stylesheet" href="sr.css" />
  <style>
    main { max-width: 1200px; margin: 0 auto; padding: 36px 32px 72px; display: flex; flex-direction: column; gap: 24px; }
    .hero { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .hero h2 { font-size: 22px; line-height: 1.2; font-weight: 600; letter-spacing: -.02em; text-align: center; }

    /* painel do dia: saudação → equipe → afastados → iniciar chamada */
    .painel-dia { display: flex; flex-direction: column; gap: 16px; }
    .cabeca-dia { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
    .cabeca-dia .quando { font-size: 13px; font-weight: 500; color: var(--texto-3); }
    .cabeca-dia h1 { font-size: 28px; line-height: 1.15; font-weight: 600; letter-spacing: -.02em; margin-top: 2px; }
    .cabeca-dia p { font-size: 14px; color: var(--texto-2); margin-top: 4px; }
    .chamada { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
    .chamada .btn { height: 52px; padding: 0 28px; border-radius: 14px; font-size: 16px; letter-spacing: .01em; box-shadow: 0 6px 18px rgba(36, 81, 214, .24); }
    .chamada .btn:disabled { box-shadow: none; }
    .estado-chamada { font-size: 13px; color: var(--texto-3); }
    .estado-chamada.ok { color: var(--sucesso); }
    .estado-chamada.pend { color: var(--atencao); }
    .equipe .kpis { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .afastados { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
    .grupo { padding: 12px 14px; border-radius: 12px; background: var(--superficie-2); border: 1px solid #EEEEEB; }
    .grupo h3 { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
    .grupo h3 i { width: 8px; height: 8px; border-radius: 99px; }
    .grupo h3 span { margin-left: auto; font-weight: 500; color: var(--texto-3); font-variant-numeric: tabular-nums; }
    .grupo ul { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 2px; font-size: 13px; color: var(--texto-2); }
    .grupo .mais { all: unset; cursor: pointer; font-size: 12px; color: var(--acao); margin-top: 4px; }
    .grupo.calmo { background: transparent; border-style: dashed; }
    .equipe-nota { font-size: 13px; color: var(--texto-3); }
    .cmd { margin-top: 6px; width: min(760px, 100%); height: 60px; display: flex; align-items: center; gap: 12px; padding: 0 8px 0 20px; background: var(--superficie); border: 1px solid var(--borda-forte); border-radius: 18px; box-shadow: var(--sombra-2); transition: border-color .2s, box-shadow .2s; }
    .cmd:focus-within { border-color: var(--acao); box-shadow: 0 0 0 4px rgba(36, 81, 214, .12), 0 8px 28px rgba(20, 20, 22, .06); }
    .cmd input { flex-grow: 1; min-width: 0; border: 0; height: 100%; font-size: 16px; padding: 0; background: transparent; box-shadow: none !important; }
    .cmd kbd { font-family: var(--mono); font-size: 12px; color: var(--texto-3); padding: 3px 8px; border: 1px solid var(--borda); border-radius: 6px; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; width: min(760px, 100%); }
    .opcoes { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; justify-content: center; font-size: 13px; color: var(--texto-2); }
    .opcoes .dia { display: inline-flex; align-items: center; gap: 8px; font-weight: 500; color: var(--texto); }
    .opcoes .dia input { width: 160px; height: 34px; }
    .opcoes .sep { width: 1px; height: 18px; background: var(--borda); }
    .semana { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; width: min(760px, 100%); }
    .sem-dia { min-width: 104px; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 8px 12px; border-radius: 12px; border: 1px solid var(--borda); background: var(--superficie); font-family: inherit; text-align: left; cursor: pointer; transition: border-color .15s, background .15s; }
    .sem-dia:hover:not(:disabled) { border-color: #CFCFCA; }
    .sem-dia .n { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--texto); }
    .sem-dia .n i { width: 7px; height: 7px; border-radius: 99px; background: #D6D6D1; }
    .sem-dia .e { font-size: 12px; color: var(--texto-3); }
    .sem-dia.ok .n i { background: var(--sucesso); } .sem-dia.ok .e { color: var(--sucesso); }
    .sem-dia.pend .n i { background: var(--atencao-ponto); } .sem-dia.pend .e { color: var(--atencao); }
    .sem-dia.falta { border-style: dashed; background: var(--superficie-2); }
    .sem-dia.futuro { opacity: .5; cursor: default; }
    .sem-dia[aria-current="date"] { border-color: var(--acao); box-shadow: 0 0 0 3px rgba(36, 81, 214, .12); }
    .conversa { display: flex; flex-direction: column; gap: 16px; }
    .bolha-eu { align-self: flex-end; max-width: 70%; padding: 10px 16px; border-radius: 16px 16px 4px 16px; background: var(--realce); font-size: 15px; }
    .bot { display: flex; gap: 14px; align-items: flex-start; }
    .bot .avatar { width: 32px; height: 32px; flex-shrink: 0; border-radius: 10px; background: var(--texto); display: grid; place-items: center; }
    .bot .corpo { flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
    .bot .fala { font-size: 16px; line-height: 1.5; }
    .bot .fala .hora { font-size: 12px; color: var(--texto-3); margin-left: 8px; }
    .dias-mini { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
    .dia-mini { padding: 10px 12px; border-radius: 12px; background: var(--superficie-2); border: 1px solid #EEEEEB; display: flex; flex-direction: column; gap: 3px; }
    .dia-mini .t { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600; }
    .dia-mini .n { font-family: var(--mono); font-size: 13px; color: #2B2B30; }
    .dia-mini .nota { font-size: 12px; }
    .acoes-linha { display: flex; gap: 8px; flex-wrap: wrap; }
    .form-ferias { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
    .form-ferias label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 500; color: var(--texto-2); }
    .form-ferias .quem { flex: 1 1 280px; } .form-ferias .quem input { width: 100%; }
    .ferias-mes { padding: 10px 12px; border-radius: 12px; background: var(--superficie-2); border: 1px solid #EEEEEB; display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--texto-2); }
    .ferias-mes b { color: var(--texto); font-size: 14px; }
    .grade { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 24px; align-items: start; }
    .lateral { display: flex; flex-direction: column; gap: 24px; }
    .kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 1px solid #EEEEEB; border-bottom: 1px solid #EEEEEB; margin-bottom: 20px; }
    .kpi { padding: 14px 0; display: flex; flex-direction: column; gap: 4px; }
    .kpi .r { font-size: 13px; color: var(--texto-3); }
    .kpi .v { font-size: 28px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .kpi .d { font-size: 12px; color: var(--texto-3); }
    .grafico { display: flex; gap: 24px; align-items: flex-end; }
    .barras { flex-grow: 1; height: 160px; display: grid; grid-auto-columns: minmax(0, 1fr); grid-auto-flow: column; gap: 14px; align-items: end; }
    .col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .pilha { width: 40px; height: 128px; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; }
    .pilha > div { width: 40px; border-radius: 3px; transition: height .4s ease; }
    .pilha.vazia { box-sizing: border-box; border: 1.5px dashed #D6D6D1; border-radius: 8px; }
    .col .dia { font-size: 12px; font-weight: 500; color: var(--texto-2); }
    .legenda { width: 140px; display: flex; flex-direction: column; gap: 10px; font-size: 13px; color: var(--texto-2); padding-bottom: 26px; }
    .legenda span { display: flex; align-items: center; gap: 8px; }
    .legenda i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
    .item-atencao { display: flex; gap: 12px; padding: 12px 8px; border-radius: 12px; transition: background .15s; }
    .item-atencao:hover { background: #F7F7F5; }
    .item-atencao .ponto { margin-top: 6px; width: 8px; height: 8px; flex-shrink: 0; border-radius: 99px; }
    .item-atencao b { display: block; font-size: 14px; font-weight: 600; }
    .item-atencao p { font-size: 13px; color: var(--texto-2); margin-top: 2px; }
    .item-atencao a { display: inline-block; font-size: 13px; font-weight: 500; margin-top: 4px; }
    .linha-tempo { display: flex; flex-direction: column; }
    .evento { display: flex; gap: 14px; }
    .evento .trilho { display: flex; flex-direction: column; align-items: center; width: 10px; }
    .evento .trilho i { margin-top: 6px; width: 8px; height: 8px; border-radius: 99px; }
    .evento .trilho u { flex-grow: 1; width: 1px; background: var(--borda); margin-top: 4px; text-decoration: none; }
    .evento:last-child .trilho u { display: none; }
    .evento .txt { padding-bottom: 14px; display: flex; flex-direction: column; gap: 2px; }
    .evento .txt b { font-size: 14px; font-weight: 500; }
    .evento .txt span { font-size: 12px; color: var(--texto-3); }
    /* progresso */
    .prog-topo { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; margin-bottom: 14px; }
    .prog-topo b { font-size: 17px; font-weight: 600; }
    .prog-topo .pct { font-family: var(--mono); font-size: 26px; font-weight: 500; letter-spacing: -.02em; }
    .prog-dias { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 16px; }
    .prog-dia { padding: 12px 14px; border-radius: 14px; border: 1px solid var(--borda); background: var(--superficie); display: flex; flex-direction: column; gap: 8px; min-height: 96px; transition: background .2s, border-color .2s; }
    .prog-dia .t { display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 600; }
    .prog-dia .fase { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--texto-3); }
    .prog-dia .det { font-size: 13px; line-height: 1.4; color: var(--texto-2); }
    .prog-dia.ativo { border-color: #C9D5F7; background: #F5F8FF; } .prog-dia.ativo .fase { color: var(--acao); }
    .prog-dia.pronto .fase { color: var(--sucesso); }
    .prog-dia.pulado { background: var(--superficie-2); } .prog-dia.pulado .fase { color: var(--atencao); }
    .prog-dia.erro { border-color: var(--erro-borda); background: var(--erro-suave); } .prog-dia.erro .fase { color: var(--erro); }
    .prog-dia.espera { background: var(--superficie-2); } .prog-dia.espera .t { color: #8A8A92; }
    /* detalhes por dia */
    details.dia { border-top: 1px solid #EEEEEB; }
    details.dia:first-of-type { border-top: 0; }
    details.dia > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 14px 4px; border-radius: 10px; }
    details.dia > summary::-webkit-details-marker { display: none; }
    details.dia > summary:hover { background: #F9F9F7; }
    details.dia > summary .seta { transition: transform .2s; }
    details.dia[open] > summary .seta { transform: rotate(90deg); }
    details.dia > summary .nome { font-weight: 600; font-size: 15px; }
    details.dia > summary .resumo { font-size: 13px; color: var(--texto-3); flex-grow: 1; }
    .dia-corpo { padding: 4px 4px 18px; display: flex; flex-direction: column; gap: 14px; }
    .motivo { font-size: 13px; color: var(--texto-2); line-height: 1.45; }
    select.just { height: 32px; min-width: 150px; font-size: 13px; }
    .just-rodape { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; padding: 12px 4px 0; font-size: 13px; }
    .arquivo { padding: 8px 12px; border: 1px dashed #CBD5E1; border-radius: 10px; color: var(--texto-3); max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    @media (max-width: 900px) {
      main { padding: 24px 18px 72px; }
      .cabeca-dia h1 { font-size: 24px; }
      .chamada { align-items: stretch; width: 100%; }
      .grade { grid-template-columns: minmax(0, 1fr); }
      .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 4px; }
      .topo nav { display: none; }
    }
  </style>
</head>
<body>
  <header class="topo">
    <div class="marca">
      <span class="logo"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"><path d="M3 5h10M3 8h6M3 11h8"/></svg></span>
      SR_dados
    </div>
    <nav aria-label="Principal">
      <button class="nav ativa" aria-current="page">Início</button>
      <button class="nav" id="navRegras">Horários e regras</button>
      <button class="nav" id="navRelatorios">Relatórios</button>
    </nav>
    <div style="display:flex;align-items:center;gap:10px">
      <span class="status" id="status"><span class="ponto"></span><span id="statusTexto">Verificando…</span></span>
      <button class="btn icone" id="btnConfig" aria-label="Configurações" title="Configurações">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#55555D" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section class="painel-dia" aria-label="Hoje">
      <div class="cabeca-dia">
        <div>
          <div class="quando" id="hoje"></div>
          <h1 id="saudacao">Olá!</h1>
          <p>Confira a situação da sua equipe e inicie a chamada quando estiver pronto.</p>
        </div>
        <div class="chamada">
          <button class="btn primario" id="btnChamada">Iniciar chamada</button>
          <span class="estado-chamada" id="estadoChamada" aria-live="polite"></span>
        </div>
      </div>
      <section class="cartao equipe" id="equipe" aria-label="Sua equipe hoje"></section>
    </section>

    <section class="hero">
      <h2>O que mais você quer fazer?</h2>
      <form class="cmd" id="formCmd" autocomplete="off">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B6B73" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="text" id="cmd" aria-label="Comando para o SR_dados" placeholder="Preencher hoje, conferir semana de 21/09, simular ontem…" />
        <kbd>Enter</kbd>
        <button class="btn primario" type="submit" id="btnCmd">Consultar</button>
      </form>
      <div class="chips" id="chips">
        <button class="chip" data-cmd="dia">Preencher dia</button>
        <button class="chip" data-cmd="semana">Conferir semana</button>
        <button class="chip" data-cmd="ferias">Lançar férias</button>
        <button class="chip" data-cmd="pendencias">Pendências de revisão</button>
        <button class="chip" data-cmd="historico">Ver histórico</button>
        <button class="chip" data-cmd="relatorios">Gerar relatório</button>
      </div>
      <div class="opcoes">
        <label class="dia">Dia <input type="date" id="data" aria-label="Dia" /></label>
        <span class="sep"></span>
        <label class="alternar" title="Mostra o que seria preenchido, sem gravar nada"><input type="checkbox" role="switch" id="simular" /> Simular (não grava)</label>
        <label class="alternar" title="Inclui o dia de hoje mesmo antes do horário de corte"><input type="checkbox" role="switch" id="forcar" /> Incluir hoje antes do corte</label>
      </div>
      <div class="semana" id="semana" aria-label="Esta semana"></div>
    </section>

    <section class="cartao entrar" id="progresso" hidden aria-live="polite">
      <div class="prog-topo">
        <div style="display:flex;flex-direction:column;gap:4px">
          <b id="progTitulo">Preenchendo…</b>
          <span class="ter" id="progEtapa"></span>
        </div>
        <span class="pct" id="progPct">0%</span>
      </div>
      <div class="barra" id="progBarraFundo"><div id="progBarra"></div></div>
      <div class="prog-dias" id="progDias"></div>
    </section>

    <section class="cartao conversa entrar" id="resposta" hidden aria-live="polite"></section>

    <div class="grade">
      <section class="cartao" aria-label="Frequência" id="freq"></section>
      <div class="lateral">
        <section class="cartao" aria-label="Precisa da sua atenção" style="padding-bottom:12px">
          <h2 style="margin:0 8px 8px">Precisa da sua atenção</h2>
          <div id="atencao"></div>
        </section>
        <section class="cartao" aria-label="Atividade recente">
          <div class="cabeca" style="margin-bottom:12px"><h2 class="titulo-secao">Atividade recente</h2><a id="lnkRelatorios">Relatórios</a></div>
          <div class="linha-tempo" id="atividade"></div>
        </section>
      </div>
    </div>

    <section class="cartao" id="detalhes" hidden aria-label="Detalhes por dia">
      <div class="cabeca"><div><h2 class="titulo-secao">Detalhes por dia</h2><div class="sub">Clique num dia para ver cada colaborador e o motivo.</div></div></div>
      <div id="detalhesDias"></div>
    </section>
  </main>

  <div class="toast" id="toast" hidden role="status"></div>

  <script src="ui.js"></script>
  <script src="comando.js"></script>
  <script>
    const LOGO = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"><path d="M3 5h10M3 8h6M3 11h8"/></svg>'
    const OK = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#177245" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3.5 8.5 3 3 6-7"/></svg>'
    const GIRA = '<svg class="spin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2451D6" stroke-width="2.4" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.2-8.6"/></svg>'
    const X = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B42318" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>'
    const SETA = '<svg class="seta" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6B6B73" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>'
    const ROT = {
      escrever: 'Preenchido', revisar: 'Sem ponto', divergente: 'Diverge', nao_encontrado: 'Não encontrado',
      sem_linha_no_mes: 'Sem linha no mês', ambiguo: 'Ambíguo', confere: 'Já conferia', ja_lancado: 'Já lançado', ausente_no_ponto: 'Outro setor', justificado: 'Justificado',
    }
    // Legenda da planilha (src/core/codigos.ts), na ordem em que costuma ser usada ao justificar.
    const JUSTIFICATIVAS = [['AT', 'Atestado médico'], ['AC', 'Atestado de comparecimento'], ['FO', 'Folga'], ['F', 'Falta'], ['FE', 'Férias'], ['S', 'Suspensão'], ['V', 'Viagem'], ['GL', 'Ginástica laboral'], ['.', 'Presença pontual'], ['P', 'Presença com atraso']]
    const NOME_CODIGO = Object.fromEntries(JUSTIFICATIVAS)

    let ultimoLote = null        // último resultado (alimenta frequência, atenção e detalhes)
    let conferencias = {}        // data → última conferência gravada (conferencias.json)
    let ocupadoAgora = false
    let naoUtilHoje = false     // domingo/feriado: sem chamada hoje

    let toastTimer = null
    function toast(texto, acao) {
      const t = $('toast')
      t.replaceChildren(el('span', { html: OK.replace('#177245', '#6EE7A8') }), el('span', { textContent: texto }), acao ? el('button', { className: 'btn pequeno', textContent: acao.rotulo, onClick: () => { t.hidden = true; acao.fn() } }) : null)
      t.hidden = false
      clearTimeout(toastTimer)
      toastTimer = setTimeout(() => { t.hidden = true }, 8000)
    }

    // ── cabeçalho: data e status ──
    const agora = new Date()
    $('hoje').textContent = `${SEMANA[agora.getDay()][0].toUpperCase() + SEMANA[agora.getDay()].slice(1)}, ${agora.getDate()} de ${MESES[agora.getMonth()]}`
    $('data').value = hojeISO()
    $('data').max = hojeISO()
    $('data').addEventListener('focus', () => { $('data').max = hojeISO() })

    // null = ainda não se sabe (ou o app não respondeu) — não acusa nada como faltando.
    let status = null
    async function atualizarStatus() {
      try {
        status = await window.agent.statusBot()
      } catch {
        status = null
        if (ocupadoAgora) return
        $('status').className = 'status aviso'
        $('statusTexto').textContent = 'Reinicie o app'
        $('status').title = 'A tela é mais nova que o app aberto — feche pelo ícone da bandeja (Sair) e abra de novo.'
        return renderAtencao()
      }
      const faltam = [!status.planilha && 'planilha', !status.ponto && 'ponto', !status.regras && 'regras'].filter(Boolean)
      if (ocupadoAgora) return
      $('status').className = 'status ' + (faltam.length ? 'aviso' : 'ok')
      $('statusTexto').textContent = faltam.length ? `Configurar ${faltam.join(', ')}` : 'Pronto · ponto e planilha'
      renderAtencao()
    }
    function statusOcupado(texto) {
      $('status').className = 'status ocupado'
      $('status').replaceChildren(el('span', { html: GIRA }), el('span', { id: 'statusTexto', textContent: texto }))
    }
    function statusNormal() {
      $('status').replaceChildren(el('span', { className: 'ponto' }), el('span', { id: 'statusTexto' }))
      atualizarStatus()
    }

    // ── navegação ──
    $('navRegras').onclick = () => window.agent.abrirRegras()
    $('navRelatorios').onclick = () => window.agent.abrirRelatorios()
    $('lnkRelatorios').onclick = () => window.agent.abrirRelatorios()
    $('btnConfig').onclick = () => window.agent.abrirConfig()
    // Desfazer uma escrita antiga (escolhendo o relatório) — pelo campo de comando: "desfazer".
    const desfazerAnterior = async () => mostrarDesfeita(await ipc(() => window.agent.desfazerDeRelatorio()))
    window.addEventListener('focus', () => { if (!ocupadoAgora) { atualizarStatus(); carregarAtividade() } })

    // `rotulo` explícito quando a ação grava: o interruptor "Simular" pode estar ligado
    // (ex.: "Gravar agora" depois de uma simulação) e a tela não pode dizer "Simulando…".
    function ocupado(sim, rotulo) {
      ocupadoAgora = sim
      for (const b of document.querySelectorAll('#chips .chip, #btnCmd, #data, #btnChamada')) b.disabled = sim || (b.id === 'btnChamada' && naoUtilHoje)
      if (sim) statusOcupado(rotulo || ($('simular').checked ? 'Simulando…' : 'Trabalhando…'))
      else statusNormal()
    }

    // ── comando (texto livre ou sugestão) ──
    $('formCmd').addEventListener('submit', e => { e.preventDefault(); executar($('cmd').value) })
    for (const c of document.querySelectorAll('#chips .chip')) {
      c.addEventListener('click', () => {
        const a = c.dataset.cmd
        if (a === 'dia' || a === 'semana') return rodar({ acao: a, data: $('data').value, simular: $('simular').checked }, c.textContent)
        executar(c.textContent)
      })
    }

    function executar(texto) {
      const r = window.interpretarComando(texto, hojeISO())
      if (r.acao === 'dia' || r.acao === 'semana') {
        if (r.data) $('data').value = r.data
        if (r.simular) $('simular').checked = true
        return rodar({ acao: r.acao, data: r.data, simular: $('simular').checked }, texto)
      }
      if (r.acao === 'regras') return window.agent.abrirRegras()
      if (r.acao === 'config') return window.agent.abrirConfig()
      if (r.acao === 'relatorios') return window.agent.abrirRelatorios()
      if (r.acao === 'historico') { carregarAtividade(); return $('atividade').scrollIntoView({ behavior: 'smooth', block: 'center' }) }
      if (r.acao === 'desfazer') return desfazerAnterior()
      if (r.acao === 'ferias') return abrirFerias(texto)
      if (r.acao === 'pendencias') {
        if (!ultimoLote) return responder(texto, [el('p', { className: 'fala', textContent: 'Ainda não há pendências nesta sessão. Rode "Preencher dia" ou "Conferir semana" e eu listo quem precisa de revisão.' })])
        return revisarDeNovo()
      }
      responder(texto, [
        el('p', { className: 'fala', textContent: r.erro || 'Ainda não entendi esse pedido.' }),
        el('div', { className: 'sec', style: 'font-size:13px', textContent: 'Experimente: "preencher hoje", "conferir semana de 21/09", "simular ontem", "lançar férias", "pendências", "abrir regras".' }),
      ])
    }

    // ── execução com progresso ──
    async function rodar({ acao, data, simular, forcar }, texto) {
      if (ocupadoAgora) return
      if (!data) return responder(texto, [el('p', { className: 'fala', textContent: 'Escolha um dia no calendário.' })])
      if (data > hojeISO()) return responder(texto, [el('p', { className: 'fala', textContent: 'Esse dia ainda não aconteceu — escolha hoje ou uma data anterior.' })])
      ocupado(true)
      $('resposta').hidden = true
      const r = await ipc(() => window.agent.preencher({ data, modo: acao, apenasConferir: simular, forcar: forcar ?? $('forcar').checked }))
      ocupado(false)
      if (!r.ok) {
        $('progresso').hidden = true
        return responderErro(texto, r.message)
      }
      ultimoLote = r.lote
      renderTudo(r.lote, simular ? 'simulacao' : 'gravado', texto, r.escrita)
      if (r.escrita && r.escrita.dias.some(d => d.escritas.length)) {
        const n = r.escrita.dias.reduce((s, d) => s + d.escritas.length, 0)
        toast(`${plural(n, 'célula gravada', 'células gravadas')} na planilha`, { rotulo: 'Desfazer', fn: desfazerUltima })
      }
      carregarAtividade()
    }

    // ── progresso ao vivo ──
    const PESO = { espera: 0, ponto: 1, planilha: 2, conferido: 3, gravar: 3, pronto: 4, pulado: 4, erro: 4 }
    const FASE = { espera: 'Aguardando', ponto: 'Lendo o ponto', planilha: 'Conferindo', conferido: 'Conferido', gravar: 'Gravando', pronto: 'Pronto', pulado: 'Pulado', erro: 'Erro' }
    let prog = { gravando: true, dias: new Map() }
    function atualizarBarra() {
      let soma = 0
      for (const d of prog.dias.values()) soma += PESO[d.fase] ?? 0
      const pct = prog.dias.size ? Math.round((100 * soma) / (prog.dias.size * 4)) : 0
      $('progBarra').style.width = pct + '%'
      $('progPct').textContent = pct + '%'
    }
    window.agent.onProgresso(ev => {
      if (ev.tipo === 'inicio') {
        prog = { gravando: ev.gravando, dias: new Map() }
        $('progresso').hidden = false
        $('progBarraFundo').className = 'barra'
        $('progTitulo').textContent = ev.gravando ? `Preenchendo ${plural(ev.datas.length, 'dia', 'dias')}…` : `Simulando ${plural(ev.datas.length, 'dia', 'dias')} — nada será gravado`
        $('progEtapa').textContent = ''
        $('progDias').replaceChildren(...ev.datas.map(data => {
          const card = el('div', { className: 'prog-dia espera' },
            el('div', { className: 't' }, el('span', { textContent: nomeDia(data) }), el('span', { className: 'ic' })),
            el('span', { className: 'fase', textContent: FASE.espera }),
            el('span', { className: 'det', textContent: 'na fila' }))
          prog.dias.set(data, { card, fase: 'espera' })
          return card
        }))
        return atualizarBarra()
      }
      if (ev.tipo === 'etapa') { $('progEtapa').textContent = ev.texto; return }
      if (ev.tipo === 'fim') {
        const problema = [...prog.dias.values()].some(d => d.fase === 'erro')
        $('progBarraFundo').className = 'barra ' + (problema ? 'falha' : 'ok')
        $('progBarra').style.width = '100%'
        $('progPct').textContent = '100%'
        $('progTitulo').textContent = problema ? 'Concluído com problemas' : (prog.gravando ? 'Concluído' : 'Simulação concluída — nada foi gravado')
        $('progEtapa').textContent = ''
        return
      }
      const d = prog.dias.get(ev.data)
      if (!d) return
      d.fase = ev.fase
      const classe = ['ponto', 'planilha', 'conferido', 'gravar'].includes(ev.fase) ? 'ativo' : ev.fase
      d.card.className = 'prog-dia ' + classe
      d.card.querySelector('.ic').innerHTML = classe === 'ativo' ? GIRA : ev.fase === 'pronto' ? OK : ev.fase === 'erro' ? X : ''
      d.card.querySelector('.fase').textContent = FASE[ev.fase] || ''
      d.card.querySelector('.det').textContent = ev.detalhe || ''
      $('progEtapa').textContent = `${diaLongo(ev.data)} · ${(FASE[ev.fase] || '').toLowerCase()}`
      atualizarBarra()
    })

    // ── resposta do bot ──
    function responder(texto, corpo) {
      const r = $('resposta')
      r.replaceChildren(
        ...(texto ? [el('div', { className: 'bolha-eu', textContent: texto })] : []),
        el('div', { className: 'bot' }, el('div', { className: 'avatar', html: LOGO }), el('div', { className: 'corpo' }, ...corpo)))
      r.hidden = false
      r.classList.remove('entrar'); void r.offsetWidth; r.classList.add('entrar')
    }
    function responderErro(texto, msg) {
      const acoes = []
      if (/Horários e regras|Regras ainda/.test(msg)) acoes.push(el('button', { className: 'btn primario pequeno', textContent: 'Abrir Horários e regras', onClick: () => window.agent.abrirRegras() }))
      else if (/Configura|ponto|Apps Script|planilha|Service Account|login/i.test(msg)) acoes.push(el('button', { className: 'btn primario pequeno', textContent: 'Abrir Configurações', onClick: () => window.agent.abrirConfig() }))
      responder(texto, [
        el('div', { className: 'alerta erro' }, el('span', { className: 'ponto' }), el('div', {}, el('b', { textContent: 'Não consegui concluir' }), el('span', { textContent: msg }), acoes.length ? el('div', { className: 'acoes' }, ...acoes) : null)),
      ])
    }

    // Mesma regra do bot (SITUACOES_PENDENTES em planner.ts) — um número só em toda a tela.
    const PENDENTES = ['revisar', 'divergente', 'nao_encontrado', 'ambiguo', 'sem_linha_no_mes']
    const pendentesDe = p => p.itens.filter(i => PENDENTES.includes(i.situacao)).length
    const LANCADOS = ['escrever', 'confere', 'ja_lancado', 'divergente', 'justificado']
    const lancadosDe = p => p.itens.filter(i => LANCADOS.includes(i.situacao)).length

    // ── esta semana: o que já foi conferido (lembra entre aberturas do app) ──
    function segundaDe(iso) { const d = deISO(iso); d.setDate(d.getDate() - (d.getDay() === 0 ? 6 : d.getDay() - 1)); return d }
    function diasDaSemana(iso) { const s = segundaDe(iso); return Array.from({ length: 6 }, (_, k) => { const d = new Date(s); d.setDate(s.getDate() + k); return isoDe(d) }) }
    function renderSemana() {
      const hoje = hojeISO(), escolhido = $('data').value || hoje
      $('semana').replaceChildren(...diasDaSemana(escolhido).map(data => {
        const c = conferencias[data], futuro = data > hoje
        let cls = 'falta', txt = data === hoje ? 'ainda não conferido' : 'não conferido'
        if (futuro) { cls = 'futuro'; txt = '—' }
        else if (c && c.feriado) { cls = ''; txt = 'feriado' }
        else if (c && c.pendencias) { cls = 'pend'; txt = `${plural(c.pendencias, 'pendência', 'pendências')}` }
        else if (c) { cls = 'ok'; txt = `conferido · ${quando(c.quando).replace(/^Hoje, |^Ontem, /, '')}` }
        const b = el('button', { className: 'sem-dia ' + cls, disabled: futuro, title: c && c.pendentes && c.pendentes.length ? 'Pendente: ' + c.pendentes.join(', ') : '', onClick: () => { $('data').value = data; renderSemana() } },
          el('span', { className: 'n' }, el('i'), nomeDia(data)), el('span', { className: 'e', textContent: txt }))
        if (data === escolhido) b.setAttribute('aria-current', 'date')
        return b
      }))
    }
    $('data').addEventListener('change', renderSemana)
    function contar(lote) {
      const t = { escrever: 0, revisar: 0, divergente: 0, nao_encontrado: 0, confere: 0 }
      for (const p of lote.planos) for (const k of Object.keys(t)) t[k] += p.resumo[k] || 0
      t.atencao = lote.planos.reduce((s, p) => s + pendentesDe(p), 0)
      return t
    }

    function renderTudo(lote, modo, texto, escrita) {
      const t = contar(lote)
      const gravadas = escrita ? escrita.dias.reduce((s, d) => s + d.escritas.length, 0) : 0
      const nDias = lote.planos.length
      const frase = el('p', { className: 'fala' })
      if (modo === 'simulacao') frase.append(el('b', { textContent: 'Simulação. ' }), `Conferi ${plural(nDias, 'dia', 'dias')}: ${plural(t.escrever, 'célula seria preenchida', 'células seriam preenchidas')}. Nada foi gravado.`)
      else if (escrita && escrita.erro) frase.append(el('b', { textContent: 'Parei no meio. ' }), escrita.erro)
      else frase.append(el('b', { textContent: 'Pronto. ' }), `Conferi ${plural(nDias, 'dia', 'dias')} e preenchi ${plural(gravadas, 'célula', 'células')}.`)
      if (t.atencao) frase.append(` ${plural(t.atencao, 'caso precisa', 'casos precisam')} da sua revisão.`)
      frase.append(el('span', { className: 'hora', textContent: `hoje, ${horaAgora()}` }))

      // Simulação: quantas seriam preenchidas. Gravado: quantos do seu ponto já estão na planilha
      // (preenchidos agora + os que já estavam) — "0 preenchidas" num dia já feito confundia.
      const mini = el('div', { className: 'dias-mini' }, ...lote.planos.map(p => {
        const doPonto = p.itens.filter(i => i.situacao !== 'ausente_no_ponto').length
        const n = modo === 'simulacao' ? `${p.escritas.length} a preencher` : `${lancadosDe(p)} de ${doPonto} lançados`
        const pend = pendentesDe(p)
        return el('div', { className: 'dia-mini' },
          el('div', { className: 't' }, el('span', { textContent: nomeDia(p.data) }), el('span', { html: pend ? '' : OK })),
          el('span', { className: 'n', textContent: n }),
          el('span', { className: 'nota', style: `color:${pend ? '#8A4F00' : '#177245'}`, textContent: pend ? `${pend} p/ revisão` : 'tudo certo' }))
      }), ...lote.pulados.map(p => el('div', { className: 'dia-mini' },
        el('div', { className: 't' }, el('span', { textContent: nomeDia(p.data) })),
        el('span', { className: 'nota ter', textContent: /domingo/i.test(p.motivo) ? 'domingo' : /oculta/i.test(p.motivo) ? 'feriado' : 'pulado' }))))

      const acoes = el('div', { className: 'acoes-linha' })
      if (t.atencao) acoes.append(el('button', { className: 'btn primario', textContent: `Revisar ${plural(t.atencao, 'pendência', 'pendências')}`, onClick: revisarDeNovo }))
      if (modo === 'simulacao' && t.escrever) acoes.append(el('button', { className: 'btn primario', textContent: `Gravar agora (${t.escrever})`, onClick: gravarSimulacao }))
      acoes.append(el('button', { className: 'btn', textContent: 'Ver detalhes', onClick: () => abrirDetalhes() }))
      if (gravadas) acoes.append(el('button', { className: 'btn fantasma', textContent: 'Desfazer', onClick: desfazerUltima }))

      const extras = []
      if (lote.erros.length) extras.push(el('div', { className: 'alerta erro' }, el('span', { className: 'ponto' }), el('div', {}, el('b', { textContent: 'Dias com problema' }), el('span', { textContent: lote.erros.map(e => `${e.data ? diaLongo(e.data) : e.arquivo}: ${e.motivo}`).join('\n') }))))
      responder(texto, [frase, mini, acoes, ...extras])
      renderFrequencia(lote)
      renderAtencao()
      renderDetalhes(lote)
    }

    async function gravarSimulacao(ev) {
      const btn = ev.currentTarget
      if (!confirm('Gravar na planilha o que a simulação mostrou?\n\nCélulas que alguém preencher nesse meio tempo serão puladas.')) return
      btn.disabled = true
      ocupado(true, 'Gravando…')
      const r = await ipc(() => window.agent.escrever())
      ocupado(false)
      if (!r.ok && !r.dias?.length) { btn.disabled = false; return responderErro('Gravar agora', r.message) }
      // A tela deixa de dizer "Simulação — nada foi gravado": passa a mostrar o que foi gravado.
      $('progresso').hidden = true
      renderTudo(ultimoLote, 'gravado', 'Gravar agora', { dias: r.dias || [], erro: r.ok ? null : r.message })
      const n = (r.dias || []).reduce((s, d) => s + d.escritas.length, 0)
      toast(`${plural(n, 'célula gravada', 'células gravadas')} na planilha`, n ? { rotulo: 'Desfazer', fn: desfazerUltima } : null)
      carregarAtividade()
    }

    async function desfazerUltima() {
      if (!confirm('Apagar as células gravadas pelo bot nesta escrita?\n\nSó são apagadas as que ainda tiverem exatamente o código que o bot gravou — o que alguém mudou depois fica.')) return
      mostrarDesfeita(await ipc(() => window.agent.desfazer()))
    }
    function mostrarDesfeita(r) {
      if (!r || (!r.ok && r.cancelado)) return
      if (!r.ok) return responderErro('Desfazer', r.message)
      const apagadas = (r.dias || []).reduce((s, d) => s + d.apagadas.length, 0)
      const mantidas = (r.dias || []).flatMap(d => d.mantidas)
      let voltaram = null
      for (const d of r.dias || []) for (const p of ultimoLote?.planos || []) {
        if (p.data !== d.data) continue
        for (const i of p.itens) if (i.situacao === 'justificado' && i.antes && d.apagadas.includes(i.celula)) {
          Object.assign(i, { situacao: i.antes.situacao, motivo: i.antes.motivo, codigo: null }); delete i.antes; voltaram = p.data
        }
      }
      if (voltaram) reRenderizar(voltaram)
      responder('Desfazer', [
        el('p', { className: 'fala' }, el('b', { textContent: 'Desfeito. ' }), `Apaguei ${plural(apagadas, 'célula', 'células')} que o bot tinha gravado.`),
        mantidas.length ? el('div', { className: 'alerta aviso' }, el('span', { className: 'ponto' }), el('div', {}, el('b', { textContent: `${plural(mantidas.length, 'célula mantida', 'células mantidas')}` }), el('span', { textContent: 'Alguém mudou depois da escrita: ' + mantidas.map(m => `${m.celula} (agora "${m.valorEncontrado}")`).join(', ') }))) : null,
      ])
      toast(`${plural(apagadas, 'célula apagada', 'células apagadas')}`)
      carregarAtividade()
    }

    // ── frequência (do último resultado) ──
    function codigoFinal(i) {
      if (i.situacao === 'escrever' || i.situacao === 'confere' || i.situacao === 'justificado') return i.codigo
      if (i.situacao === 'divergente' || i.situacao === 'ja_lancado') return (i.valorAtual || '').trim().toUpperCase()
      if (['revisar', 'nao_encontrado', 'ambiguo', 'sem_linha_no_mes'].includes(i.situacao)) return 'REV'
      return null
    }
    function renderFrequencia(lote) {
      const f = $('freq')
      if (!lote || !lote.planos.length) {
        f.replaceChildren(
          el('div', { className: 'cabeca' }, el('div', {}, el('h2', { className: 'titulo-secao', textContent: 'Frequência' }), el('div', { className: 'sub', textContent: 'Aparece aqui depois de preencher ou conferir.' }))),
          el('div', { className: 'vazio' },
            el('div', { className: 'icone', html: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B6B73" stroke-width="1.8" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>' }),
            el('b', { textContent: 'Sem dados ainda' }),
            el('span', { textContent: 'Clique em "Conferir semana" para ver pontualidade, atrasos e pendências dia a dia.' }),
            el('button', { className: 'btn primario pequeno', textContent: 'Conferir semana', onClick: () => rodar({ acao: 'semana', data: $('data').value, simular: $('simular').checked }, 'Conferir semana') })))
        return
      }
      // Categorias do gráfico, de baixo pra cima. Ausência só aparece na legenda se houver.
      const CAT = [
        ['p', 'Pontual (.)', '#2451D6', ['.', 'GL']],
        ['a', 'Atraso (P)', '#E3A13B', ['P']],
        ['at', 'Atestado (AT/AC)', '#7A5AF8', ['AT', 'AC']],
        ['f', 'Falta (F)', '#B42318', ['F']],
        ['o', 'Férias, folga e outros', '#5FB3A6', ['FE', 'FO', 'S', 'V']],
        ['r', 'Para revisão', '#C4C4BE', ['REV']],
      ]
      const catDe = Object.fromEntries(CAT.flatMap(([k, , , cods]) => cods.map(c => [c, k])))
      const dias = lote.planos.map(p => {
        const c = Object.fromEntries(CAT.map(([k]) => [k, 0]))
        let noPonto = 0
        for (const i of p.itens) {
          if (i.situacao !== 'ausente_no_ponto') noPonto++
          const k = catDe[codigoFinal(i)]
          if (k) c[k]++
        }
        return { data: p.data, c, noPonto }
      })
      const soma = k => dias.reduce((s, d) => s + d.c[k], 0)
      const pont = soma('p'), atr = soma('a'), rev = soma('r'), faltas = soma('f'), atest = soma('at'), outras = soma('o')
      const presentes = pont + atr, noPonto = dias.reduce((s, d) => s + d.noPonto, 0)
      const taxa = presentes ? Math.round((100 * pont) / presentes) : null
      const max = Math.max(1, ...dias.map(d => CAT.reduce((s, [k]) => s + d.c[k], 0)))
      const px = n => Math.round((n / max) * 124)
      const primeiro = lote.planos[0].data, ultimo = lote.planos[lote.planos.length - 1].data
      const periodo = primeiro === ultimo ? diaLongo(primeiro) : `${nomeDia(primeiro)} a ${nomeDia(ultimo)} · ${plural(lote.planos.length, 'dia', 'dias')}`
      const pulados = lote.pulados.length ? ` · ${plural(lote.pulados.length, 'domingo/feriado pulado', 'domingos/feriados pulados')}` : ''
      const kpi = (r, v, d) => el('div', { className: 'kpi' }, el('span', { className: 'r', textContent: r }), el('span', { className: 'v', textContent: v }), el('span', { className: 'd', textContent: d }))
      const partesAus = [faltas && plural(faltas, 'falta', 'faltas'), atest && plural(atest, 'atestado', 'atestados'), outras && `${outras} férias/folga`].filter(Boolean)
      f.replaceChildren(
        el('div', { className: 'cabeca' }, el('div', {},
          el('h2', { className: 'titulo-secao', textContent: 'Frequência' }),
          el('div', { className: 'sub', textContent: periodo + pulados + ' · colaboradores do seu ponto' }))),
        el('div', { className: 'kpis' },
          kpi('Presentes', String(presentes), primeiro === ultimo ? `de ${noPonto} do seu ponto` : `de ${noPonto} registros nos dias`),
          kpi('Pontualidade', taxa === null ? '—' : taxa + '%', 'pontuais ÷ presentes'),
          kpi('Atrasos', String(atr), 'marcados com P'),
          kpi('Ausências', String(faltas + atest + outras), partesAus.join(' · ') || 'nenhuma'),
          kpi('Para revisão', String(rev), 'sem ponto, nome ou linha')),
        el('div', { className: 'grafico' },
          el('div', { className: 'barras' }, ...dias.map(d => el('div', { className: 'col' },
            el('div', { className: 'pilha', title: CAT.filter(([k]) => d.c[k]).map(([k, rot]) => `${d.c[k]} ${rot}`).join(' · ') },
              // Do topo pra base: a última categoria (revisão) fica em cima, pontual embaixo.
              ...[...CAT].reverse().filter(([k]) => d.c[k]).map(([k, , cor], n, vis) => el('div', {
                style: `height:${px(d.c[k])}px;background:${cor};border-radius:${n === 0 ? '8px 8px ' : '3px 3px '}${n === vis.length - 1 ? '8px 8px' : '3px 3px'}`,
              }))),
            el('span', { className: 'dia', textContent: nomeDia(d.data) }))),
            ...lote.pulados.map(p => el('div', { className: 'col' }, el('div', { className: 'pilha vazia' }), el('span', { className: 'dia', textContent: nomeDia(p.data) })))),
          el('div', { className: 'legenda' },
            ...CAT.filter(([k]) => ['p', 'a', 'r'].includes(k) || soma(k)).map(([, rot, cor]) => el('span', {}, el('i', { style: `background:${cor}` }), rot)))))
    }

    // ── precisa da sua atenção ──
    function renderAtencao() {
      const itens = []
      const add = (cor, titulo, texto, acao, fn) => itens.push(el('div', { className: 'item-atencao' },
        el('span', { className: 'ponto', style: `background:${cor}` }),
        el('div', {}, el('b', { textContent: titulo }), el('p', { textContent: texto }), acao ? el('a', { textContent: acao, onClick: fn }) : null)))
      if (status && !status.planilha) add('#B42318', 'Planilha não conectada', 'Sem ela o bot não consegue ler nem gravar.', 'Abrir Configurações', () => window.agent.abrirConfig())
      if (status && !status.ponto) add('#B42318', 'Login do ponto não configurado', 'O bot usa o seu login da Central do Funcionário.', 'Abrir Configurações', () => window.agent.abrirConfig())
      if (status && !status.regras) add('#E3A13B', 'Horários e regras vazios', 'Defina entrada padrão, tolerância e horário de corte.', 'Abrir Horários e regras', () => window.agent.abrirRegras())
      // Dias desta semana (até hoje, sem domingo) sem conferência gravada.
      const hoje = hojeISO()
      const faltam = diasDaSemana(hoje).filter(d => d <= hoje && !conferencias[d])
      if (faltam.includes(hoje)) add('#2451D6', 'Hoje ainda não foi conferido', 'O bot lembra o que já foi feito — quando conferir, some daqui.', 'Iniciar chamada', iniciarChamada)
      const antes = faltam.filter(d => d !== hoje)
      if (antes.length) add('#E3A13B', `${antes.map(nomeDia).join(', ')} ${antes.length === 1 ? 'não foi conferido' : 'não foram conferidos'}`, 'Nenhum preenchimento gravado nesses dias.', 'Conferir semana', () => rodar({ acao: 'semana', data: hoje, simular: $('simular').checked }, 'Conferir semana'))
      if (ultimoLote) {
        const itensDe = s => ultimoLote.planos.flatMap(p => p.itens.filter(i => i.situacao === s).map(i => ({ ...i, data: p.data })))
        const rev = itensDe('revisar'), nao = itensDe('nao_encontrado'), div = itensDe('divergente')
        if (rev.length) add('#E3A13B', `${plural(rev.length, 'pessoa sem ponto', 'pessoas sem ponto')}`, `${[...new Set(rev.map(i => nomeDia(i.data)))].join(', ')}. Pode ser folga, atestado ou falta — só você decide.`, 'Revisar', revisarDeNovo)
        if (nao.length) add('#B42318', `${plural(nao.length, 'nome não encontrado', 'nomes não encontrados')}`, `${nao[0].motivo} Depois de cadastrar, confira o dia de novo para sumir daqui.`, 'Cadastrar apelido', () => window.agent.abrirRegras())
        if (div.length) add('#B42318', `${plural(div.length, 'lançamento diverge', 'lançamentos divergem')} do ponto`, 'O bot não alterou nada — confira se o horário individual está certo.', 'Revisar', revisarDeNovo)
        if (ultimoLote.erros.length) add('#B42318', `${plural(ultimoLote.erros.length, 'dia com erro', 'dias com erro')}`, ultimoLote.erros[0].motivo, null)
      }
      $('atencao').replaceChildren(...(itens.length ? itens : [el('div', { className: 'vazio', style: 'padding:14px 8px 18px' },
        el('div', { className: 'icone', html: OK }), el('b', { textContent: 'Nada pendente' }), el('span', { textContent: 'Quando algo precisar de você, aparece aqui.' }))]))
    }

    // ── férias: FE em todos os dias úteis do período (padrão: o mês todo) ──
    function fimDoMes(d) { return isoDe(new Date(d.getFullYear(), d.getMonth() + 1, 0)) }
    async function abrirFerias(texto) {
      // Lista de colaboradores: a última lida da planilha (a mesma de Horários e regras).
      let colabs = [], setores = []
      try {
        const r = await window.agent.regrasCarregar()
        colabs = (r && r.cache && r.cache.colaboradores) || []
        setores = (r && r.regras && r.regras.setores) || []
      } catch { /* sem lista: digita o ADM */ }
      const meus = colabs.filter(c => c.ativo && (!setores.length || setores.includes(c.setor)))
      const lista = el('datalist', { id: 'feriasColabs' }, ...meus.map(c => el('option', { value: `${c.adm} — ${c.nome}` })))
      const quem = el('input', { type: 'text', placeholder: meus.length ? 'Digite o nome ou o ADM' : 'ADM do colaborador', 'aria-label': 'Colaborador' })
      quem.setAttribute('list', 'feriasColabs')
      const h = deISO(hojeISO())
      const ini = el('input', { type: 'date', value: isoDe(new Date(h.getFullYear(), h.getMonth(), 1)), 'aria-label': 'Primeiro dia de férias' })
      const fim = el('input', { type: 'date', value: fimDoMes(h), 'aria-label': 'Último dia de férias' })
      const mesInteiro = desloc => () => {
        const d = new Date(h.getFullYear(), h.getMonth() + desloc, 1)
        ini.value = isoDe(d); fim.value = fimDoMes(d)
      }
      const saida = el('div', { style: 'display:flex;flex-direction:column;gap:10px' })
      const btn = el('button', { className: 'btn primario', type: 'submit', textContent: 'Ver prévia' })
      const form = el('form', { className: 'form-ferias', autocomplete: 'off' },
        el('label', { className: 'quem' }, 'Colaborador', quem),
        el('label', {}, 'De', ini),
        el('label', {}, 'Até', fim),
        btn)
      form.addEventListener('submit', async e => {
        e.preventDefault()
        const adm = (quem.value.split('—')[0] || '').trim()
        if (!adm) return quem.focus()
        if (!ini.value || !fim.value) return
        btn.disabled = true
        ocupado(true, 'Lendo a planilha…')
        const r = await ipc(() => window.agent.ferias({ adm, inicio: ini.value, fim: fim.value }))
        ocupado(false)
        btn.disabled = false
        renderPreviaFerias(saida, r, { adm, nome: quem.value, inicio: ini.value, fim: fim.value })
      })
      responder(texto, [
        el('p', { className: 'fala', textContent: 'Quem vai sair de férias? Eu gravo FE em todos os dias do período — domingos e feriados ficam de fora, e nada que já estiver preenchido é apagado.' }),
        lista, form,
        el('div', { className: 'acoes-linha' },
          el('button', { className: 'btn pequeno', type: 'button', textContent: 'Este mês', onClick: mesInteiro(0) }),
          el('button', { className: 'btn pequeno', type: 'button', textContent: 'Próximo mês', onClick: mesInteiro(1) })),
        saida,
      ])
      quem.focus()
    }

    function renderPreviaFerias(saida, r, pedido) {
      if (!r.ok) return saida.replaceChildren(el('div', { className: 'alerta erro' }, el('span', { className: 'ponto' }), el('div', {}, el('b', { textContent: 'Não deu pra preparar as férias' }), el('span', { textContent: r.message }))))
      const total = r.planos.reduce((s, p) => s + p.escritas.length, 0)
      const primeiro = r.planos.flatMap(p => p.itens)[0]
      const nome = (primeiro && primeiro.nomePlanilha) || pedido.nome
      const meses = r.planos.map(p => {
        const conferem = p.itens.filter(i => i.situacao === 'confere').length
        const outros = p.itens.filter(i => i.situacao === 'ja_lancado')
        return el('div', { className: 'ferias-mes' },
          el('b', { textContent: `${p.aba}: ${plural(p.escritas.length, 'dia a gravar', 'dias a gravar')}` }),
          conferem ? el('span', { textContent: `${plural(conferem, 'dia já está', 'dias já estão')} com FE` }) : null,
          outros.length ? el('span', { style: 'color:#8A4F00', textContent: `Não mexo (já preenchidos): ${outros.map(i => i.motivo).join('; ')}` }) : null,
          ...p.avisos.filter(a => /^Não preenchidos/.test(a)).map(a => el('span', { className: 'ter', textContent: a })))
      })
      const frase = el('p', { className: 'fala' }, el('b', { textContent: nome + ': ' }),
        total ? `${plural(total, 'dia', 'dias')} de férias para gravar entre ${dataCurta(pedido.inicio)} e ${dataCurta(pedido.fim)}.` : 'nada a gravar nesse período — os dias úteis já estão preenchidos.')
      const acoes = el('div', { className: 'acoes-linha' })
      if (total) {
        const gravar = el('button', { className: 'btn primario', textContent: `Gravar férias (${plural(total, 'dia', 'dias')})` })
        gravar.onclick = async () => {
          if (!confirm(`Gravar FE em ${plural(total, 'dia', 'dias')} para ${nome}?\n\nCélulas que alguém preencher nesse meio tempo serão puladas.`)) return
          gravar.disabled = true
          ocupado(true, 'Gravando…')
          const g = await ipc(() => window.agent.ferias({ adm: pedido.adm, inicio: pedido.inicio, fim: pedido.fim, gravar: true }))
          ocupado(false)
          const n = (g.dias || []).reduce((s, d) => s + d.escritas.length, 0)
          const puladas = (g.dias || []).flatMap(d => d.puladas)
          saida.replaceChildren(
            g.ok || n
              ? el('p', { className: 'fala' }, el('b', { textContent: 'Pronto. ' }), `Gravei FE em ${plural(n, 'dia', 'dias')} para ${nome}.`, puladas.length ? ` ${plural(puladas.length, 'célula foi pulada', 'células foram puladas')} (alguém preencheu antes).` : '')
              : null,
            !g.ok ? el('div', { className: 'alerta erro' }, el('span', { className: 'ponto' }), el('div', {}, el('b', { textContent: 'Não consegui concluir' }), el('span', { textContent: g.message }))) : null,
            n ? el('div', { className: 'acoes-linha' }, el('button', { className: 'btn fantasma', textContent: 'Desfazer', onClick: desfazerUltima })) : null)
          if (n) toast(`Férias gravadas: ${plural(n, 'dia', 'dias')}`, { rotulo: 'Desfazer', fn: desfazerUltima })
          carregarAtividade()
        }
        acoes.append(gravar)
      }
      saida.replaceChildren(frase, ...meses, acoes)
    }

    // ── painel do dia (saudação, equipe hoje, iniciar chamada) ──
    function saudacao(nome) {
      const h = new Date().getHours()
      return `${h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite'}${nome ? ', ' + nome : ''}!`
    }
    $('saudacao').textContent = saudacao(null)
    ;(async () => {
      try { const p = await window.agent.perfil(); if (p && p.nome) $('saudacao').textContent = saudacao(p.nome) } catch { /* fica a genérica */ }
    })()

    // Estado da chamada de hoje: o que o app lembra (conferencias.json).
    function renderEstadoChamada() {
      const c = conferencias[hojeISO()], e = $('estadoChamada'), b = $('btnChamada')
      if (naoUtilHoje) { e.className = 'estado-chamada'; e.textContent = 'Hoje não há chamada'; b.textContent = 'Iniciar chamada'; return }
      if (!c) { e.className = 'estado-chamada'; e.textContent = 'Chamada de hoje ainda não feita'; b.textContent = 'Iniciar chamada'; return }
      e.className = 'estado-chamada ' + (c.pendencias ? 'pend' : 'ok')
      e.textContent = `Chamada feita às ${quando(c.quando).replace(/^Hoje, /, '')}` + (c.pendencias ? ` · ${plural(c.pendencias, 'pendência', 'pendências')}` : ' · tudo certo')
      b.textContent = 'Atualizar chamada' // rodar de novo completa quem chegou depois; nunca sobrescreve
    }

    // A chamada é o "Preencher dia" de hoje, sempre liberado (mesmo antes do horário de corte):
    // quem bateu ganha "." ou "P", quem ainda não bateu fica pendente (nunca "F").
    async function iniciarChamada() {
      const hoje = hojeISO()
      $('data').value = hoje
      renderSemana()
      await rodar({ acao: 'dia', data: hoje, simular: false, forcar: true }, $('btnChamada').textContent)
      carregarPanorama()
    }
    $('btnChamada').addEventListener('click', iniciarChamada)

    const GRUPOS = [
      ['folga', 'Folga', '#5FB3A6'],
      ['ferias', 'Férias', '#2451D6'],
      ['atestado', 'Atestado', '#7A5AF8'],
      ['falta', 'Falta', '#B42318'],
      ['outros', 'Suspensão / viagem', '#8A8A92'],
      ['pendente', 'Para revisão (nome ou linha)', '#E3A13B'],
      ['sem_ponto', 'Ainda sem ponto', '#C4C4BE'],
    ]
    let panoramaAtual = null
    async function carregarPanorama() {
      const box = $('equipe')
      if (!panoramaAtual) box.replaceChildren(cabecaEquipe('Lendo o ponto e a planilha de hoje…'), el('div', { className: 'sk', style: 'height:64px' }))
      else box.style.opacity = '.6' // mantém o anterior enquanto atualiza (sem piscar)
      const r = await ipc(() => window.agent.panoramaDia())
      box.style.opacity = ''
      if (!r.ok) {
        const acao = /Configura|ponto|planilha|Apps Script|login|senha/i.test(r.message || '') ? el('button', { className: 'btn primario pequeno', textContent: 'Abrir Configurações', onClick: () => window.agent.abrirConfig() }) : null
        return box.replaceChildren(cabecaEquipe(''), el('div', { className: 'alerta aviso' }, el('span', { className: 'ponto' }), el('div', {}, el('b', { textContent: 'Não deu pra ver a equipe de hoje agora' }), el('span', { textContent: r.message }), acao ? el('div', { className: 'acoes' }, acao) : null)))
      }
      naoUtilHoje = !!r.naoUtil
      $('btnChamada').disabled = naoUtilHoje || ocupadoAgora
      renderEstadoChamada()
      if (r.naoUtil) {
        panoramaAtual = null
        return box.replaceChildren(cabecaEquipe(''), el('div', { className: 'equipe-nota', textContent: /domingo/i.test(r.naoUtil) ? 'Hoje é domingo — não há chamada.' : 'Hoje é feriado na planilha (coluna do dia oculta) — não há chamada.' }))
      }
      panoramaAtual = r
      renderEquipe(r)
    }
    function cabecaEquipe(sub) {
      return el('div', { className: 'cabeca' },
        el('div', {}, el('h2', { className: 'titulo-secao', textContent: 'Sua equipe hoje' }), el('div', { className: 'sub', textContent: sub })),
        el('a', { textContent: 'Atualizar', onClick: carregarPanorama }))
    }
    function renderEquipe(p) {
      const c = p.contagem
      const kpi = (rot, v, d) => el('div', { className: 'kpi' }, el('span', { className: 'r', textContent: rot }), el('span', { className: 'v', textContent: String(v) }), el('span', { className: 'd', textContent: d }))
      const afastados = c.folga + c.ferias + c.atestado + c.falta + c.outros
      const grupos = GRUPOS.filter(([k]) => c[k]).map(([k, rot, cor]) => grupo(rot, cor, p.pessoas.filter(x => x.situacao === k)))
      $('equipe').replaceChildren(
        cabecaEquipe(`Ponto, planilha (aba ${p.aba}) e exceções de hoje · atualizado às ${horaAgora()}`),
        el('div', { className: 'kpis' },
          kpi('Total na equipe', p.total, 'do seu ponto'),
          kpi('Em atividade', c.presente, c.sem_ponto ? `${c.sem_ponto} ainda sem ponto` : 'já bateram ponto'),
          kpi('De folga', c.folga, 'FO na planilha'),
          kpi('De férias', c.ferias, 'FE ou "FÉRIAS" no ponto'),
          kpi('Em atestado', c.atestado, 'AT/AC na planilha')),
        grupos.length ? el('div', { className: 'afastados' }, ...grupos)
          : el('div', { className: 'equipe-nota', textContent: 'Ninguém afastado e todo mundo já bateu ponto.' }),
        afastados ? null : el('div', { className: 'equipe-nota', style: 'margin-top:8px', textContent: 'Ninguém de folga, férias ou atestado hoje.' }))
    }
    // Um bloco por situação; listas longas mostram 6 nomes e "mais N".
    function grupo(rotulo, cor, pessoas) {
      const MAX = 6
      const lista = el('ul')
      const mostrar = n => lista.replaceChildren(...pessoas.slice(0, n).map(x => el('li', { textContent: x.nome, title: x.adm ? `ADM ${x.adm}${x.entrada ? ' · entrada ' + x.entrada : ''}` : '' })))
      mostrar(MAX)
      const mais = pessoas.length > MAX ? el('button', { className: 'mais', textContent: `mais ${pessoas.length - MAX}`, onClick: e => { mostrar(pessoas.length); e.currentTarget.remove() } }) : null
      return el('div', { className: 'grupo' + (rotulo === 'Ainda sem ponto' ? ' calmo' : '') },
        el('h3', {}, el('i', { style: `background:${cor}` }), rotulo, el('span', { textContent: String(pessoas.length) })), lista, mais)
    }
    carregarPanorama()

    // ── atividade recente ──
    async function carregarAtividade() {
      try { conferencias = (await window.agent.conferencias()) || {} } catch { /* app antigo aberto */ }
      renderSemana()
      renderEstadoChamada()
      renderAtencao()
      const h = await window.agent.historico()
      $('atividade').replaceChildren(...(h.length ? h.map(e => el('div', { className: 'evento' },
        el('div', { className: 'trilho' }, el('i', { style: `background:${e.tipo === 'escrita' ? '#2451D6' : e.tipo === 'justificativa' ? '#177245' : e.tipo === 'ferias' ? '#7A5AF8' : '#E3A13B'}` }), el('u')),
        el('div', { className: 'txt' },
          el('b', { textContent: e.tipo === 'escrita' ? `${nomeDia(e.data)} preenchido · ${plural(e.celulas, 'célula', 'células')}` : e.tipo === 'ferias' ? `Férias · ${e.aba} · ${plural(e.celulas, 'dia', 'dias')}` : e.tipo === 'justificativa' ? `Justificativa · ${nomeDia(e.data)} · ${plural(e.celulas, 'célula', 'células')}` : `Escrita desfeita · ${nomeDia(e.data)} · ${plural(e.celulas, 'célula', 'células')}` }),
          el('span', { textContent: quando(e.quando) })))) : [el('div', { className: 'vazio', style: 'padding:8px 0 4px' },
        el('b', { textContent: 'Nenhuma execução ainda' }), el('span', { textContent: 'Quando você preencher um dia, ele aparece aqui.' }))]))
    }

    // ── detalhes por dia ──
    const FILTROS = [
      ['pendencias', 'Precisa de você', ['revisar', 'divergente', 'nao_encontrado', 'ambiguo', 'sem_linha_no_mes']],
      ['preenchidos', 'Preenchidos', ['escrever', 'justificado']],
      ['conferem', 'Já conferem', ['confere', 'ja_lancado']],
      ['outros', 'Outros setores', ['ausente_no_ponto']],
    ]
    function badgeDe(i) {
      if (i.situacao === 'escrever' || i.situacao === 'confere' || i.situacao === 'justificado') {
        const c = i.codigo
        const cls = c === '.' ? 'acao' : c === 'P' ? 'aviso' : c === 'FE' ? 'ok' : ''
        return el('span', { className: 'badge ' + cls }, el('span', { className: 'cod', textContent: c }), ROT[i.situacao])
      }
      const cls = { revisar: 'aviso', divergente: 'erro', nao_encontrado: 'erro', ambiguo: 'erro', sem_linha_no_mes: 'aviso' }[i.situacao] || ''
      return el('span', { className: 'badge ' + cls, textContent: ROT[i.situacao] || i.situacao })
    }
    // Só quem ficou "sem ponto" (célula vazia) pode ser justificado — o resto
    // ou não tem célula (nome/linha não achados) ou já tem valor (não mexemos).
    const podeJustificar = i => i.situacao === 'revisar' && !!i.celula
    function tabela(itens, plano) {
      if (!itens.length) return el('div', { className: 'vazio', style: 'padding:14px' }, el('span', { textContent: 'Nada nesta categoria.' }))
      const comJust = itens.some(podeJustificar)
      const escolhas = new Map() // célula → código escolhido
      const btnGravar = el('button', { className: 'btn primario pequeno', textContent: 'Gravar justificativas', disabled: true })
      const atualizarBtn = () => {
        btnGravar.disabled = !escolhas.size
        btnGravar.textContent = escolhas.size ? `Gravar ${plural(escolhas.size, 'justificativa', 'justificativas')}` : 'Gravar justificativas'
      }
      const seletor = i => {
        const s = el('select', { className: 'just', 'aria-label': `Justificar ${i.nomePlanilha || i.nomePonto}` },
          el('option', { value: '', textContent: 'Justificar…' }),
          ...JUSTIFICATIVAS.map(([c, rot]) => el('option', { value: c, textContent: `${c} · ${rot}` })))
        s.addEventListener('change', () => { if (s.value) escolhas.set(i.celula, s.value); else escolhas.delete(i.celula); atualizarBtn() })
        return s
      }
      const tb = el('tbody', {}, ...itens.map(i => el('tr', {},
        el('td', {}, el('div', { style: 'font-weight:500', textContent: i.nomePlanilha || i.nomePonto || '—' }), el('div', { className: 'ter', style: 'font-size:12px', textContent: i.adm ? 'ADM ' + i.adm : '' })),
        el('td', { className: 'mono', textContent: i.ponto ? (i.ponto.status === 'batido' ? i.ponto.entrada1 : i.ponto.status === 'ferias' ? 'férias' : '—') : '—' }),
        el('td', { className: 'mono ter', textContent: i.horario ? i.horario.previsto : '' }),
        el('td', {}, badgeDe(i)),
        el('td', { className: 'motivo', textContent: i.motivo }),
        comJust ? el('td', {}, podeJustificar(i) ? seletor(i) : null) : null,
        el('td', { className: 'mono', style: 'text-align:right', textContent: i.celula || '—' }))))
      const cols = ['Colaborador', 'Ponto', 'Previsto', 'Situação', 'Por quê', ...(comJust ? ['Justificar'] : []), 'Célula']
      const tab = el('table', {}, el('thead', {}, el('tr', {}, ...cols.map((h, k) => el('th', { textContent: h, style: k === cols.length - 1 ? 'text-align:right' : '' })))), tb)
      if (!comJust) return tab
      btnGravar.addEventListener('click', () => gravarJustificativas(plano, [...escolhas].map(([celula, codigo]) => ({ celula, codigo })), btnGravar))
      return el('div', {}, tab, el('div', { className: 'just-rodape' },
        el('span', { className: 'ter', textContent: 'Escolha o código de quem ficou sem ponto. Só grava em célula ainda vazia — dá pra desfazer.' }), btnGravar))
    }

    async function gravarJustificativas(plano, itens, btn) {
      if (!itens.length || ocupadoAgora) return
      const nomes = itens.map(x => { const i = plano.itens.find(i => i.celula === x.celula); return `${i.nomePlanilha || i.nomePonto} → ${x.codigo}` })
      if (!confirm(`Gravar na aba ${plano.aba} (${diaLongo(plano.data)})?\n\n${nomes.join('\n')}`)) return
      btn.disabled = true
      ocupado(true, 'Gravando…')
      const r = await ipc(() => window.agent.justificar({ data: plano.data, itens }))
      ocupado(false)
      if (!r.ok) { btn.disabled = false; return responderErro('Justificar', r.message) }
      // Atualiza a tela: quem foi gravado sai das pendências e passa pra "Preenchidos".
      for (const e of r.escritas) {
        const i = plano.itens.find(i => i.celula === e.celula)
        Object.assign(i, { antes: { situacao: i.situacao, motivo: i.motivo }, situacao: 'justificado', codigo: e.codigo, motivo: `Justificado por você: ${e.codigo} · ${NOME_CODIGO[e.codigo] || ''}` })
      }
      reRenderizar(plano.data)
      const msg = `${plural(r.escritas.length, 'justificativa gravada', 'justificativas gravadas')}`
      if (r.puladas.length) {
        responder('Justificar', [el('div', { className: 'alerta aviso' }, el('span', { className: 'ponto' }), el('div', {}, el('b', { textContent: `${msg}; ${plural(r.puladas.length, 'célula pulada', 'células puladas')}` }), el('span', { textContent: 'Alguém preencheu antes: ' + r.puladas.map(p => `${p.celula} ("${p.valorEncontrado}")`).join(', ') })))])
      }
      toast(msg, r.escritas.length ? { rotulo: 'Desfazer', fn: desfazerUltima } : null)
      carregarAtividade()
    }

    // Redesenha frequência/atenção/detalhes mantendo aberto o dia que estava sendo mexido.
    function reRenderizar(dataAberta) {
      if (!ultimoLote) return
      renderFrequencia(ultimoLote)
      renderAtencao()
      renderDetalhes(ultimoLote)
      const det = [...document.querySelectorAll('#detalhesDias details.dia')][ultimoLote.planos.findIndex(p => p.data === dataAberta)]
      if (det) det.open = true
    }
    function renderDetalhes(lote) {
      // Aviso que vale para todos os dias (ex.: da aba do mês) aparece uma vez só, no topo.
      const comuns = lote.planos.length ? [...new Set(lote.planos[0].avisos)].filter(a => lote.planos.every(p => p.avisos.includes(a))) : []
      const topo = comuns.length ? el('div', { className: 'alerta aviso', style: 'margin-bottom:8px' }, el('span', { className: 'ponto' }), el('div', {}, el('b', { textContent: 'Avisos da planilha' }), el('span', { textContent: comuns.join('\n') }))) : null
      $('detalhesDias').replaceChildren(...(topo ? [topo] : []), ...lote.planos.map(p => {
        const corpo = el('div', { className: 'dia-corpo' })
        const seg = el('div', { className: 'segmentos', role: 'tablist' })
        const area = el('div')
        const mostrar = chave => {
          for (const b of seg.children) b.setAttribute('aria-selected', String(b.dataset.k === chave))
          const f = FILTROS.find(x => x[0] === chave)
          area.replaceChildren(tabela(p.itens.filter(i => f[2].includes(i.situacao)), p))
        }
        for (const [k, rot, sits] of FILTROS) {
          const n = p.itens.filter(i => sits.includes(i.situacao)).length
          seg.append(el('button', { className: 'aba', role: 'tab', textContent: `${rot} · ${n}`, onClick: () => mostrar(k), 'data-k': k }))
        }
        const pend = pendentesDe(p)
        mostrar(pend ? 'pendencias' : 'preenchidos')
        const avisos = [...new Set(p.avisos)].filter(a => !comuns.includes(a))
        corpo.append(seg, area)
        if (avisos.length) corpo.append(el('div', { className: 'alerta aviso' }, el('span', { className: 'ponto' }), el('div', {}, el('b', { textContent: 'Avisos deste dia' }), el('span', { textContent: avisos.join('\n') }))))
        const det = el('details', { className: 'dia', 'data-pend': String(pend) },
          el('summary', {}, el('span', { html: SETA }), el('span', { className: 'nome', textContent: `${diaLongo(p.data)}` }),
            el('span', { className: 'resumo', textContent: `aba ${p.aba} · ${p.escritas.length} a preencher · ${pend} precisa(m) de você` }),
            pend ? el('span', { className: 'badge aviso', textContent: `${pend}` }) : el('span', { html: OK })),
          corpo)
        return det
      }))
      $('detalhes').hidden = !lote.planos.length
    }
    function abrirDetalhes(filtro) {
      $('detalhes').hidden = false
      for (const d of document.querySelectorAll('#detalhesDias details.dia')) {
        const abrir = filtro === 'pendencias' ? d.dataset.pend !== '0' : true
        d.open = abrir
        if (abrir && filtro === 'pendencias') d.querySelector('.aba[data-k="pendencias"]')?.click()
      }
      $('detalhes').scrollIntoView({ behavior: 'smooth', block: 'start' })
    }

    // "Revisar": roda o bot de novo nos dias do último resultado — o que você
    // corrigiu (apelido, exceção, alguém que bateu o ponto depois) já entra — e
    // abre o que ainda precisa de você (sem ponto → justificar).
    async function revisarDeNovo() {
      const datas = (ultimoLote?.planos || []).map(p => p.data).sort()
      if (!datas.length) return responder('Revisar pendências', [el('p', { className: 'fala', textContent: 'Ainda não há pendências. Rode "Preencher dia" ou "Conferir semana" e eu listo quem precisa de revisão.' })])
      $('data').value = datas[0]
      renderSemana()
      await rodar({ acao: datas.length > 1 ? 'semana' : 'dia', data: datas[0], simular: $('simular').checked }, 'Revisar pendências')
      if (ultimoLote && ultimoLote.planos.some(p => pendentesDe(p))) abrirDetalhes('pendencias')
    }

    // ── início ──
    renderFrequencia(null)
    renderSemana()
    atualizarStatus()
    carregarAtividade()
    // Ao reabrir: volta o último resultado em "Precisa da sua atenção", na frequência e
    // nos detalhes (dá pra justificar). "Revisar" roda o bot de novo nesses dias.
    ;(async () => {
      let est = null
      try { est = await window.agent.estadoInicial() } catch { return }
      if (!est || !est.ultimo || ultimoLote) return
      conferencias = est.conferencias || conferencias
      ultimoLote = est.ultimo.lote
      renderFrequencia(ultimoLote)
      renderAtencao()
      renderDetalhes(ultimoLote)
      renderSemana()
    })()
    $('cmd').focus()
  </script>
</body>
</html>
