<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'" />
  <title>SR_dados — Relatório de Pontualidade</title>
  <link rel="stylesheet" href="sr.css" />
  <style>
    main { max-width: 1200px; margin: 0 auto; padding: 32px 32px 72px; display: flex; flex-direction: column; gap: 20px; }

    /* cabeçalho da página */
    .pagina { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
    .pagina h1 { font-size: 26px; font-weight: 600; letter-spacing: -.02em; }
    .pagina p { font-size: 14px; color: var(--texto-2); margin-top: 4px; max-width: 620px; }
    .pagina .periodo { margin-top: 10px; font-size: 13px; color: var(--texto-3); }
    .pagina .periodo b { color: var(--texto); font-weight: 600; }
    .pagina .acoes { display: flex; gap: 8px; flex-wrap: wrap; }

    /* filtros */
    .filtros { display: flex; flex-direction: column; gap: 14px; padding: 18px 20px; }
    .filtros .linha { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
    .filtros label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 500; color: var(--texto-3); }
    .filtros .quem { flex: 1 1 260px; } .filtros .quem input { width: 100%; }
    .filtros select { min-width: 170px; }
    .filtros .datas { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--texto-3); }

    /* indicadores: clicar filtra a tabela pela situação */
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
    .kpi { text-align: left; font-family: inherit; color: inherit; background: var(--superficie); border: 1px solid var(--borda); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; cursor: pointer; box-shadow: var(--sombra-1); transition: border-color .15s, box-shadow .15s, background .15s; }
    .kpi:hover { border-color: var(--borda-forte); box-shadow: var(--sombra-2); }
    .kpi[aria-pressed="true"] { border-color: var(--acao); box-shadow: 0 0 0 3px rgba(36, 81, 214, .12); }
    .kpi:disabled { cursor: default; box-shadow: var(--sombra-1); border-color: var(--borda); }
    .kpi .r { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--texto-2); font-weight: 500; }
    .kpi .r i { width: 8px; height: 8px; border-radius: 99px; }
    .kpi .v { font-size: 28px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .kpi .d { font-size: 12px; color: var(--texto-3); }

    /* tabela */
    .busca { flex: 0 1 280px; min-width: 0; }
    #tab th:first-child { padding-left: 12px; }
    .rolagem { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }
    #tab { min-width: 860px; }
    th button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
    th button:focus-visible { box-shadow: var(--foco); border-radius: 4px; }
    th[aria-sort] button { color: var(--texto); }
    th .seta { font-size: 10px; opacity: .7; }
    td { vertical-align: middle; }
    tbody tr.reg { cursor: pointer; }
    tbody tr.reg.atraso td:first-child { box-shadow: inset 3px 0 0 var(--erro-ponto); }
    tbody tr.reg.divergente td:first-child, tbody tr.reg.pendente td:first-child { box-shadow: inset 3px 0 0 var(--atencao-ponto); }
    tbody tr.reg td:first-child { padding-left: 12px; }
    tbody tr.reg[aria-expanded="true"] { background: var(--superficie-2); }
    tr.detalhe td { border-top: 0; padding: 0 12px 16px 12px; background: var(--superficie-2); }
    .detalhe-grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px 20px; font-size: 13px; }
    .detalhe-grade span { display: block; font-size: 12px; color: var(--texto-3); }
    .detalhe-grade .longo { grid-column: 1 / -1; }
    .dif { font-family: var(--mono); font-size: 13px; white-space: nowrap; }
    .dif.mais { color: var(--erro); } .dif.menos { color: var(--acao-texto); }
    .nome { font-weight: 500; }
    .paginacao { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 14px; font-size: 13px; color: var(--texto-3); flex-wrap: wrap; }
    .paginacao div { display: flex; gap: 8px; }

    /* gráficos: série única = uma cor (a de ação); texto sempre em cor de texto */
    .graficos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
    .graficos:empty { display: none; }
    .graficos .largo { grid-column: 1 / -1; }
    .graficos .cartao { padding: 20px 22px; }
    body.carregando #kpis, body.carregando #graficos, body.carregando #tabCorpo { opacity: .6; transition: opacity .15s; }

    .plot { position: relative; padding-left: 40px; }
    .plot .grade { position: absolute; left: 40px; right: 0; height: 1px; background: #EEEEEB; }
    .plot .grade span { position: absolute; right: calc(100% + 8px); top: -8px; font-size: 11px; color: var(--texto-3); font-variant-numeric: tabular-nums; }
    .plot .base { background: #DADAD6; }
    .colunas { position: relative; display: flex; align-items: flex-end; gap: 2px; height: 168px; }
    .coluna { flex: 1 1 0; min-width: 6px; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; background: none; border: 0; padding: 0; cursor: pointer; font: inherit; border-radius: 6px; }
    .coluna:hover, .coluna:focus-visible { background: rgba(36, 81, 214, .06); outline: none; }
    .coluna i { display: block; width: 100%; max-width: 24px; background: var(--acao); border-radius: 4px 4px 0 0; }
    .coluna:hover i, .coluna:focus-visible i { background: var(--acao-escura); }
    .coluna .rot { font-size: 11px; font-weight: 600; color: var(--texto-2); margin-bottom: 4px; font-variant-numeric: tabular-nums; }
    .eixo-x { display: flex; gap: 2px; margin-top: 6px; }
    .eixo-x span { flex: 1 1 0; min-width: 6px; text-align: center; font-size: 11px; color: var(--texto-3); white-space: nowrap; }

    .lista-barras { display: flex; flex-direction: column; gap: 2px; }
    .barra-h { display: grid; grid-template-columns: minmax(0, 190px) minmax(0, 1fr); align-items: center; gap: 12px; min-height: 32px; padding: 4px 8px; border: 0; border-radius: 8px; background: none; text-align: left; font: inherit; color: inherit; cursor: pointer; }
    .barra-h:hover, .barra-h:focus-visible, .barra-h[aria-pressed="true"] { background: var(--realce); outline: none; }
    .barra-h:disabled { cursor: default; background: none; }
    .barra-h .rot { font-size: 13px; color: var(--texto-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .barra-h .trilho { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; }
    .barra-h .trilho > span:first-child { display: block; }
    .barra-h i { display: block; height: 12px; min-width: 2px; background: var(--acao); border-radius: 0 4px 4px 0; }
    .barra-h:disabled i { background: #C4C4BE; }
    .barra-h .val { font-size: 12px; color: var(--texto-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .nota-grafico { font-size: 12px; color: var(--texto-3); margin-top: 10px; }

    .dica { position: fixed; z-index: 30; max-width: 260px; padding: 8px 10px; border-radius: 8px; background: var(--texto); color: #FFFFFF; font-size: 12px; line-height: 1.45; box-shadow: var(--sombra-3); pointer-events: none; display: flex; flex-direction: column; gap: 1px; }
    .dica b { font-size: 13px; }

    /* detalhamento do colaborador */
    .painel-fundo { position: fixed; inset: 0; z-index: 20; background: rgba(20, 20, 22, .28); display: flex; justify-content: flex-end; }
    .painel { width: min(640px, 100%); height: 100%; overflow-y: auto; background: var(--fundo); box-shadow: var(--sombra-3); padding: 24px; display: flex; flex-direction: column; gap: 16px; animation: deslizar .2s ease-out both; }
    @keyframes deslizar { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
    .painel-topo { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .painel-topo h2 { font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
    .painel-topo .sub { font-size: 13px; color: var(--texto-3); margin-top: 2px; }
    #pCorpo { display: flex; flex-direction: column; gap: 16px; }
    .mini-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .mini-kpis div { background: var(--superficie); border: 1px solid var(--borda); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
    .mini-kpis span { font-size: 12px; color: var(--texto-3); }
    .mini-kpis b { font-size: 22px; font-weight: 600; letter-spacing: -.02em; }
    .divergente-plot .colunas { height: 160px; align-items: stretch; }
    .divergente-plot .coluna { justify-content: flex-start; position: relative; }
    .divergente-plot .coluna i { position: absolute; left: 50%; transform: translateX(-50%); width: 100%; }
    .divergente-plot .coluna i.depois { background: #D4622A; border-radius: 4px 4px 0 0; }
    .divergente-plot .coluna i.antes { background: var(--acao); border-radius: 0 0 4px 4px; }
    .divergente-plot .coluna .cod { position: absolute; left: 0; right: 0; text-align: center; font-family: var(--mono); font-size: 10px; color: var(--texto-3); }
    .divergente-plot .limite { z-index: 1; pointer-events: none; position: absolute; left: 40px; right: 0; border-top: 1px dashed #D4622A; opacity: .7; }
    .divergente-plot .limite span { position: absolute; right: 0; top: -16px; font-size: 11px; color: var(--texto-2); background: var(--superficie); padding: 0 4px; }
    .legenda-h { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--texto-2); margin-top: 10px; }
    .legenda-h span { display: inline-flex; align-items: center; gap: 6px; }
    .legenda-h i { width: 10px; height: 10px; border-radius: 3px; }

    @media (max-width: 900px) { .graficos { grid-template-columns: minmax(0, 1fr); } }
    @media (max-width: 560px) { .mini-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .barra-h { grid-template-columns: minmax(0, 110px) minmax(0, 1fr); } .painel { padding: 16px; } }

    @media (max-width: 760px) {
      main { padding: 20px 16px 72px; }
      .topo { padding: 0 16px; }
      .pagina h1 { font-size: 22px; }
      .filtros select, .busca { width: 100%; min-width: 0; }
      .filtros label { flex: 1 1 140px; }
      .filtros .datas { flex: 1 1 100%; min-width: 0; } .filtros .datas input { flex: 1 1 0; width: 0; min-width: 0; }
    }
    @media (max-width: 480px) {
      .topo .marca { font-size: 0; gap: 0; }
      .topo .nav { padding: 7px 8px; }
    }
  </style>
</head>
<body>
  <header class="topo">
    <div class="marca">
      <span class="logo"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"><path d="M3 5h10M3 8h6M3 11h8"/></svg></span>
      SR_dados
    </div>
    <nav aria-label="Principal">
      <button class="nav" id="navInicio">Início</button>
      <button class="nav" id="navRegras">Horários e regras</button>
      <button class="nav ativa" aria-current="page">Relatórios</button>
    </nav>
    <button class="btn icone" id="btnConfig" aria-label="Configurações" title="Configurações">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#55555D" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
  </header>

  <main>
    <div class="pagina">
      <div>
        <h1>Relatório de Pontualidade</h1>
        <p>Quem chegou no horário, quem atrasou e o que precisa de atenção — a partir das conferências do ponto feitas por este app.</p>
        <div class="periodo" id="periodoTexto">Carregando…</div>
      </div>
      <div class="acoes">
        <button class="btn fantasma" id="btnPasta" title="Relatórios .txt e .json de cada gravação">Pasta de relatórios</button>
        <button class="btn" id="btnAtualizar">Atualizar</button>
        <button class="btn primario" id="btnExportar">Exportar CSV</button>
      </div>
    </div>

    <section class="cartao filtros" aria-label="Filtros">
      <div class="linha">
        <div class="segmentos" role="tablist" aria-label="Período" id="periodos"></div>
        <div class="datas">
          <input type="date" id="inicio" aria-label="De" /> até <input type="date" id="fim" aria-label="Até" />
        </div>
      </div>
      <div class="linha">
        <label class="quem">Colaborador ou ADM <input type="text" id="colab" list="colabs" placeholder="Todos" autocomplete="off" /></label>
        <label>Setor <select id="setor"><option value="">Todos</option></select></label>
        <label>Situação <select id="classe"><option value="">Todas</option></select></label>
        <label>Motivo <select id="motivo"><option value="">Todos</option></select></label>
        <button class="btn fantasma pequeno" id="btnLimpar" hidden>Limpar filtros</button>
      </div>
      <datalist id="colabs"></datalist>
    </section>

    <section class="kpis" id="kpis" aria-label="Indicadores"></section>

    <div class="graficos" id="graficos"></div>

    <section class="cartao" aria-label="Registros">
      <div class="cabeca">
        <div><h2 class="titulo-secao">Registros</h2><div class="sub" id="tabSub"></div></div>
        <input type="text" class="busca" id="busca" placeholder="Buscar nome ou ADM" aria-label="Buscar nome ou ADM" autocomplete="off" />
      </div>
      <div id="tabCorpo"></div>
    </section>
  </main>

  <div class="toast" id="toast" hidden role="status"></div>
  <div class="dica" id="dica" role="tooltip" hidden></div>

  <!-- Detalhamento de um colaborador -->
  <div class="painel-fundo" id="painelFundo" hidden>
    <aside class="painel" role="dialog" aria-modal="true" aria-labelledby="pNome">
      <div class="painel-topo">
        <div><h2 id="pNome"></h2><div class="sub" id="pSub"></div></div>
        <button class="btn icone" id="pFechar" aria-label="Fechar">✕</button>
      </div>
      <div id="pCorpo"></div>
    </aside>
  </div>

  <script src="ui.js"></script>
  <script>
    // Mesmas classes e rótulos de src/core/pontualidade.ts (ROTULO_CLASSE).
    const CLASSES = {
      pontual: { rotulo: 'Pontual', cor: 'var(--sucesso-ponto)', badge: 'ok' },
      atraso: { rotulo: 'Atraso', cor: 'var(--erro-ponto)', badge: 'erro' },
      adiantado: { rotulo: 'Adiantado', cor: 'var(--acao)', badge: 'acao' },
      divergente: { rotulo: 'Divergente', cor: 'var(--atencao-ponto)', badge: 'aviso' },
      ausencia: { rotulo: 'Ausência justificada', cor: '#8A8A92', badge: '' },
      pendente: { rotulo: 'Pendente', cor: 'var(--atencao-ponto)', badge: 'aviso' },
    }
    const POR_PAGINA = 25

    // ── estado da tela ──
    const filtros = { inicio: '', fim: '', adm: '', busca: '', setor: '', classe: '', motivo: '' }
    let periodo = '30d'
    let rel = null                 // último relatório recebido
    let ordem = { col: 'data', dir: -1 }
    let pagina = 0
    const abertos = new Set()      // linhas com o detalhe aberto
    let consulta = 0               // descarta respostas fora de ordem

    // Período e situação escolhidos ficam lembrados nesta máquina (conveniência).
    try { const p = JSON.parse(localStorage.getItem('rel-pontualidade') || '{}'); if (p.periodo) periodo = p.periodo; if (p.periodo === 'custom') Object.assign(filtros, { inicio: p.inicio || '', fim: p.fim || '' }) } catch { /* sem armazenamento */ }
    const lembrar = () => { try { localStorage.setItem('rel-pontualidade', JSON.stringify({ periodo, inicio: filtros.inicio, fim: filtros.fim })) } catch { /* idem */ } }

    // ── navegação e ações ──
    $('navInicio').onclick = () => window.agent.abrirInicio()
    $('navRegras').onclick = () => window.agent.abrirRegras()
    $('btnConfig').onclick = () => window.agent.abrirConfig()
    $('btnPasta').onclick = () => window.agent.abrirPastaRelatorios()
    $('btnAtualizar').onclick = () => carregar(true)
    $('btnExportar').onclick = exportar

    let toastTimer = null
    function toast(texto, acao) {
      const t = $('toast')
      t.replaceChildren(el('span', { textContent: texto }), acao ? el('button', { className: 'btn pequeno', textContent: acao.rotulo, onClick: () => { t.hidden = true; acao.fn() } }) : null)
      t.hidden = false
      clearTimeout(toastTimer)
      toastTimer = setTimeout(() => { t.hidden = true }, 6000)
    }

    // ── período ──
    const PERIODOS = [
      ['7d', 'Últimos 7 dias', () => [somarDias(hojeISO(), -6), hojeISO()]],
      ['30d', 'Últimos 30 dias', () => [somarDias(hojeISO(), -29), hojeISO()]],
      ['mes', 'Este mês', () => [hojeISO().slice(0, 8) + '01', hojeISO()]],
      ['mesAnt', 'Mês passado', () => { const d = deISO(hojeISO().slice(0, 8) + '01'); const fim = somarDias(isoDe(d), -1); return [fim.slice(0, 8) + '01', fim] }],
      ['tudo', 'Tudo', () => ['', '']],
    ]
    function aplicarPeriodo(id) {
      periodo = id
      const p = PERIODOS.find(x => x[0] === id)
      if (p) [filtros.inicio, filtros.fim] = p[2]()
      $('inicio').value = filtros.inicio
      $('fim').value = filtros.fim
      for (const b of $('periodos').children) b.setAttribute('aria-selected', String(b.dataset.id === periodo))
    }
    $('periodos').replaceChildren(...PERIODOS.map(([id, rotulo]) => el('button', { className: 'aba', role: 'tab', textContent: rotulo, 'data-id': id, onClick: () => { aplicarPeriodo(id); mudou() } })))
    for (const id of ['inicio', 'fim']) {
      $(id).addEventListener('change', () => {
        filtros[id] = $(id).value
        periodo = 'custom'
        for (const b of $('periodos').children) b.setAttribute('aria-selected', 'false')
        mudou()
      })
    }

    // ── demais filtros ──
    $('colab').addEventListener('change', () => {
      const v = $('colab').value.trim()
      filtros.adm = (/^(\d+)\s*—/.exec(v) || /^(\d+)$/.exec(v) || [])[1] || ''
      // Texto que não é um colaborador da lista vira busca por nome.
      if (!filtros.adm && v) { filtros.busca = v; $('busca').value = v; $('colab').value = '' }
      mudou()
    })
    for (const id of ['setor', 'classe', 'motivo']) $(id).addEventListener('change', () => { filtros[id] = $(id).value; mudou() })
    let buscaTimer = null
    $('busca').addEventListener('input', () => { clearTimeout(buscaTimer); buscaTimer = setTimeout(() => { filtros.busca = $('busca').value.trim(); mudou() }, 200) })
    $('btnLimpar').onclick = () => {
      Object.assign(filtros, { adm: '', busca: '', setor: '', classe: '', motivo: '' })
      for (const id of ['colab', 'busca', 'setor', 'classe', 'motivo']) $(id).value = ''
      mudou()
    }
    function filtrarPor(campo, valor) {
      filtros[campo] = filtros[campo] === valor ? '' : valor
      if (campo !== 'adm') $(campo).value = filtros[campo]
      else $('colab').value = filtros.adm ? rotuloColab(filtros.adm) : ''
      mudou()
    }

    function mudou() { pagina = 0; abertos.clear(); lembrar(); carregar() }

    // ── dados ──
    async function carregar(avisar) {
      const n = ++consulta
      // Mantém o que está na tela, só esmaecido, enquanto a resposta não chega (sem piscar).
      document.body.classList.add('carregando')
      const r = await ipc(() => window.agent.pontualidade(criterios()))
      if (n !== consulta) return
      document.body.classList.remove('carregando')
      if (!r.ok) {
        $('periodoTexto').textContent = ''
        $('kpis').replaceChildren()
        return $('tabCorpo').replaceChildren(el('div', { className: 'alerta erro' }, el('span', { className: 'ponto' }), el('div', {}, el('b', { textContent: 'Não deu pra montar o relatório' }), el('span', { textContent: r.message }))))
      }
      rel = r
      render()
      if (avisar) toast('Relatório atualizado')
    }
    // Só os critérios preenchidos vão pro processo principal.
    function criterios() { return Object.fromEntries(Object.entries(filtros).filter(([, v]) => v)) }

    function render() {
      renderPeriodo()
      renderOpcoes()
      renderKpis()
      renderGraficos()
      renderTabela()
      $('btnLimpar').hidden = !['adm', 'busca', 'setor', 'classe', 'motivo'].some(k => filtros[k])
      $('btnExportar').disabled = !rel.registros.length
    }

    function renderPeriodo() {
      const c = rel.cobertura
      const t = $('periodoTexto')
      if (!c.dias) return t.replaceChildren('Ainda sem histórico.')
      const p = filtros.inicio || filtros.fim
        ? `${filtros.inicio ? dataCurta(filtros.inicio) : 'início'} a ${filtros.fim ? dataCurta(filtros.fim) : 'hoje'}`
        : 'todo o histórico'
      t.replaceChildren('Período: ', el('b', { textContent: p }),
        ` · histórico desde ${dataCurta(c.primeiro)} (${plural(c.dias, 'dia conferido', 'dias conferidos')})`)
    }

    const rotuloColab = adm => { const c = rel && rel.opcoes.colaboradores.find(x => x.adm === adm); return c ? `${c.adm} — ${c.nome}` : adm }
    function preencherSelect(sel, opcoes, valor, todos) {
      sel.replaceChildren(el('option', { value: '', textContent: todos }), ...opcoes.map(([v, t]) => el('option', { value: v, textContent: t })))
      sel.value = valor
    }
    function renderOpcoes() {
      preencherSelect($('setor'), rel.opcoes.setores.map(s => [s, s]), filtros.setor, 'Todos')
      preencherSelect($('classe'), Object.entries(CLASSES).map(([k, c]) => [k, c.rotulo]), filtros.classe, 'Todas')
      preencherSelect($('motivo'), rel.opcoes.motivos.map(m => [m, m]), filtros.motivo, 'Todos')
      $('setor').disabled = !rel.opcoes.setores.length
      $('colabs').replaceChildren(...rel.opcoes.colaboradores.map(c => el('option', { value: `${c.adm} — ${c.nome}` })))
    }

    // ── indicadores ──
    function kpi({ rotulo, valor, detalhe, cor, classe, desabilitado }) {
      const ativo = classe !== undefined && filtros.classe === classe && classe !== ''
      return el('button', {
        className: 'kpi', disabled: !!desabilitado, 'aria-pressed': String(ativo),
        title: classe ? `Mostrar só: ${rotulo.toLowerCase()}` : classe === '' ? 'Mostrar todas as situações' : '',
        onClick: () => { if (classe === undefined) return; filtros.classe = ativo ? '' : classe; $('classe').value = filtros.classe; mudou() },
      }, el('span', { className: 'r' }, cor ? el('i', { style: `background:${cor}` }) : null, rotulo),
        el('span', { className: 'v', textContent: valor }),
        el('span', { className: 'd', textContent: detalhe }))
    }
    function renderKpis() {
      const c = rel.contagem
      const pct = n => (c.total ? `${Math.round(100 * n / c.total)}% dos registros` : '—')
      const minAtraso = rel.minutosAtraso
      $('kpis').replaceChildren(
        kpi({ rotulo: 'Registros', valor: c.total, classe: '', detalhe: c.ausencia || c.pendente ? `${plural(c.ausencia, 'ausência', 'ausências')} · ${plural(c.pendente, 'pendente', 'pendentes')}` : 'colaboradores × dias' }),
        kpi({ rotulo: 'Pontuais', valor: c.pontual, classe: 'pontual', cor: CLASSES.pontual.cor, detalhe: pct(c.pontual) }),
        kpi({ rotulo: 'Atrasos', valor: c.atraso, classe: 'atraso', cor: CLASSES.atraso.cor, detalhe: c.atraso ? `${minAtraso} min além do previsto` : 'nenhum no período' }),
        kpi({ rotulo: 'Adiantados', valor: c.adiantado, classe: 'adiantado', cor: CLASSES.adiantado.cor, detalhe: `${rel.adiantadoMin}+ min antes do previsto` }),
        kpi({ rotulo: 'Divergências', valor: c.divergente, classe: 'divergente', cor: CLASSES.divergente.cor, detalhe: 'planilha diferente do ponto' }),
        kpi({ rotulo: 'Pontualidade', valor: c.pontualidadePct === null ? '—' : `${String(c.pontualidadePct).replace('.', ',')}%`, desabilitado: true, detalhe: 'pontuais + adiantados ÷ quem bateu ponto' }))
    }

    // ── tabela ──
    const fmtDif = r => {
      if (r.diferencaMin === null) return el('span', { className: 'ter', textContent: '—' })
      const d = r.diferencaMin
      return el('span', { className: 'dif ' + (r.classe === 'atraso' ? 'mais' : r.classe === 'adiantado' ? 'menos' : ''), textContent: `${d > 0 ? '+' : d < 0 ? '−' : ''}${Math.abs(d)} min` })
    }
    const COLUNAS = [
      ['nome', 'Colaborador', r => r.nome, r => el('span', { className: 'nome', textContent: r.nome })],
      ['adm', 'ADM', r => Number(r.adm) || 0, r => el('span', { className: 'mono', textContent: r.adm || '—' })],
      ['data', 'Dia', r => r.data, r => nomeDia(r.data)],
      ['previsto', 'Previsto', r => r.previsto || '', r => el('span', { className: 'mono', textContent: r.previsto || '—' })],
      ['entrada', 'Realizado', r => r.entrada || '', r => el('span', { className: 'mono', textContent: r.entrada || '—' })],
      ['diferencaMin', 'Diferença', r => r.diferencaMin ?? -Infinity, fmtDif],
      ['classe', 'Situação', r => CLASSES[r.classe].rotulo, r => el('span', { className: 'badge ' + CLASSES[r.classe].badge, textContent: CLASSES[r.classe].rotulo })],
      ['motivoCurto', 'Motivo', r => r.motivoCurto, r => el('span', { className: 'sec', textContent: r.motivoCurto || '—' })],
      ['setor', 'Setor', r => r.setor, r => r.setor || el('span', { className: 'ter', textContent: '—' })],
    ]

    function ordenados() {
      const col = COLUNAS.find(c => c[0] === ordem.col)
      const chave = r => `${r.data}|${r.adm}|${r.nome}`
      return [...rel.registros].sort((a, b) => {
        const x = col[2](a), y = col[2](b)
        return (x < y ? -1 : x > y ? 1 : 0) * ordem.dir || chave(a).localeCompare(chave(b))
      })
    }

    function renderTabela() {
      const regs = rel.registros
      $('tabSub').textContent = regs.length ? `${plural(regs.length, 'registro', 'registros')} · clique numa linha para ver os detalhes` : ''
      if (!rel.cobertura.dias) {
        return $('tabCorpo').replaceChildren(vazio('Ainda não há conferências guardadas',
          'O relatório se monta sozinho a cada dia que você preencher ou conferir na tela inicial.', 'Ir para o Início', () => window.agent.abrirInicio()))
      }
      if (!regs.length) {
        return $('tabCorpo').replaceChildren(vazio('Nenhum registro com esses filtros',
          'Tente outro período ou limpe os filtros.', 'Limpar filtros', () => { $('btnLimpar').click(); if (periodo !== 'tudo') { aplicarPeriodo('tudo'); mudou() } }))
      }
      const total = Math.ceil(regs.length / POR_PAGINA)
      pagina = Math.min(pagina, total - 1)
      const pag = ordenados().slice(pagina * POR_PAGINA, (pagina + 1) * POR_PAGINA)

      const cab = el('tr', {}, ...COLUNAS.map(([id, rotulo]) => {
        const th = el('th', {}, el('button', { onClick: () => { ordem = { col: id, dir: ordem.col === id ? -ordem.dir : (id === 'data' || id === 'diferencaMin' ? -1 : 1) }; pagina = 0; renderTabela() } },
          rotulo, ordem.col === id ? el('span', { className: 'seta', textContent: ordem.dir > 0 ? '▲' : '▼' }) : null))
        if (ordem.col === id) th.setAttribute('aria-sort', ordem.dir > 0 ? 'ascending' : 'descending')
        return th
      }))
      const corpo = el('tbody')
      for (const r of pag) {
        const id = `${r.data}|${r.adm}|${r.nome}`
        const aberto = abertos.has(id)
        const tr = el('tr', { className: `reg ${r.classe}`, tabIndex: 0, 'aria-expanded': String(aberto) }, ...COLUNAS.map(c => el('td', {}, c[3](r))))
        const alternar = () => { aberto ? abertos.delete(id) : abertos.add(id); renderTabela() }
        tr.addEventListener('click', alternar)
        tr.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); alternar() } })
        corpo.append(tr)
        if (aberto) corpo.append(el('tr', { className: 'detalhe' }, el('td', { colSpan: COLUNAS.length }, detalhe(r))))
      }
      const paginacao = el('div', { className: 'paginacao' },
        el('span', { textContent: `${pagina * POR_PAGINA + 1}–${pagina * POR_PAGINA + pag.length} de ${regs.length}` }),
        total > 1 ? el('div', {},
          el('button', { className: 'btn pequeno', textContent: 'Anterior', disabled: pagina === 0, onClick: () => { pagina--; renderTabela() } }),
          el('span', { style: 'align-self:center', textContent: `Página ${pagina + 1} de ${total}` }),
          el('button', { className: 'btn pequeno', textContent: 'Próxima', disabled: pagina >= total - 1, onClick: () => { pagina++; renderTabela() } })) : null)
      $('tabCorpo').replaceChildren(el('div', { className: 'rolagem' }, el('table', { id: 'tab' }, el('thead', {}, cab), corpo)), paginacao)
    }

    function detalhe(r) {
      const campo = (rotulo, valor, longo) => el('div', { className: longo ? 'longo' : '' }, el('span', { textContent: rotulo }), valor || '—')
      return el('div', { className: 'detalhe-grade' },
        campo('Horário previsto vem de', r.origem),
        campo('Tolerância', r.toleranciaMin === null ? null : `${r.toleranciaMin} min`),
        campo('Na planilha', r.codigo ? `"${r.codigo}"` : 'vazio'),
        campo('Pelo ponto seria', r.codigoBot ? `"${r.codigoBot}"` : 'sem decisão (precisa de uma pessoa)'),
        campo('Nome no ponto', r.nomePonto),
        campo('Detalhe', r.motivo, true),
        r.adm ? el('div', { className: 'longo', style: 'display:flex;gap:8px;flex-wrap:wrap' },
          el('button', { className: 'btn primario pequeno', textContent: `Ver histórico de ${r.nome.split(' ')[0]}`, onClick: e => { e.stopPropagation(); abrirColaborador(r.adm) } }),
          el('button', { className: 'btn pequeno', textContent: filtros.adm === r.adm ? 'Mostrar todos os colaboradores' : `Filtrar só ${r.nome.split(' ')[0]}`, onClick: e => { e.stopPropagation(); filtrarPor('adm', r.adm) } })) : null)
    }

    function vazio(titulo, texto, botao, fn) {
      return el('div', { className: 'vazio' },
        el('div', { className: 'icone', html: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B6B73" stroke-width="1.8" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>' }),
        el('b', { textContent: titulo }), el('span', { textContent: texto }),
        el('button', { className: 'btn primario pequeno', textContent: botao, onClick: fn }))
    }

    // ── dica (tooltip): mouse e teclado mostram o mesmo ──
    function comDica(alvo, linhas) {
      const dica = $('dica')
      const mostrar = () => {
        const [titulo, ...resto] = linhas()
        dica.replaceChildren(el('b', { textContent: titulo }), ...resto.filter(Boolean).map(t => el('span', { textContent: t })))
        dica.hidden = false
        const r = alvo.getBoundingClientRect(), d = dica.getBoundingClientRect()
        const x = Math.min(Math.max(8, r.left + r.width / 2 - d.width / 2), innerWidth - d.width - 8)
        const y = r.top - d.height - 8 < 8 ? r.bottom + 8 : r.top - d.height - 8
        dica.style.left = x + 'px'; dica.style.top = y + 'px'
      }
      const esconder = () => { dica.hidden = true }
      alvo.addEventListener('mouseenter', mostrar); alvo.addEventListener('focus', mostrar)
      alvo.addEventListener('mouseleave', esconder); alvo.addEventListener('blur', esconder)
      alvo.addEventListener('click', esconder)
      return alvo
    }
    const pctTexto = p => (p === null ? '—' : `${String(p).replace('.', ',')}%`)
    const resumoContagem = c => [
      `${c.pontual + c.adiantado} no horário · ${plural(c.atraso, 'atraso', 'atrasos')}`,
      c.ausencia || c.pendente || c.divergente ? [c.ausencia && plural(c.ausencia, 'ausência', 'ausências'), c.pendente && plural(c.pendente, 'pendente', 'pendentes'), c.divergente && plural(c.divergente, 'divergência', 'divergências')].filter(Boolean).join(' · ') : '',
    ]

    // ── gráficos ──
    // Rótulo a cada `passo` dias e sempre no último — mas nunca um rótulo colado no último.
    const rotuloEixo = (k, n, passo) => k === n - 1 || (k % passo === 0 && k + passo <= n - 1)
    function cartaoGrafico(titulo, sub, corpo, largo) {
      return el('section', { className: 'cartao' + (largo ? ' largo' : '') },
        el('div', { className: 'cabeca', style: 'margin-bottom:14px' }, el('div', {}, el('h2', { className: 'titulo-secao', textContent: titulo }), el('div', { className: 'sub', textContent: sub }))),
        corpo)
    }
    function renderGraficos() {
      const g = $('graficos')
      if (!rel.registros.length && !rel.porDia.length) return g.replaceChildren()
      const cartoes = [cartaoGrafico('Evolução da pontualidade', 'Pontuais + adiantados ÷ quem bateu ponto, por dia. Clique num dia para ver só ele.', graficoEvolucao(), true)]
      cartoes.push(cartaoGrafico('Principais motivos', 'O que tirou os registros do "pontual". Clique para filtrar.', graficoMotivos()))
      cartoes.push(cartaoGrafico('Quem mais precisa de atenção', 'Ocorrências (atrasos, divergências e pendências) · minutos de atraso. Clique para ver o histórico.', graficoRanking()))
      if (rel.porSetor.length >= 2) cartoes.push(cartaoGrafico('Pontualidade por setor', 'Clique para filtrar o setor.', graficoSetores(), true))
      g.replaceChildren(...cartoes)
    }

    // Colunas de % (eixo fixo 0–100%). Rótulo só no último dia; menor e maior vão numa linha embaixo; o resto, na dica.
    function graficoEvolucao() {
      const dias = rel.porDia
      if (!dias.length) return el('div', { className: 'nota-grafico', textContent: 'Sem dias no período.' })
      const comPct = dias.filter(d => d.contagem.pontualidadePct !== null)
      const menor = comPct.length > 1 ? comPct.reduce((a, b) => (b.contagem.pontualidadePct < a.contagem.pontualidadePct ? b : a)) : null
      const maior = comPct.length > 1 ? comPct.reduce((a, b) => (b.contagem.pontualidadePct > a.contagem.pontualidadePct ? b : a)) : null
      const ultimo = comPct[comPct.length - 1]
      const passo = Math.ceil(dias.length / 6)
      const grade = [100, 50, 0].map(v => el('div', { className: 'grade' + (v === 0 ? ' base' : ''), style: `top:${(1 - v / 100) * 168}px` }, el('span', { textContent: v + '%' })))
      const colunas = dias.map(d => {
        const p = d.contagem.pontualidadePct
        const rot = d === ultimo ? el('span', { className: 'rot', textContent: pctTexto(p) }) : null
        const b = el('button', {
          className: 'coluna', 'aria-label': `${diaLongo(d.chave)}: pontualidade ${pctTexto(p)}`,
          onClick: () => { periodo = 'custom'; filtros.inicio = filtros.fim = d.chave; aplicarPeriodo('custom'); mudou() },
        }, rot, el('i', { style: `height:${p === null ? 0 : Math.max(2, (p / 100) * 168)}px` }))
        return comDica(b, () => [diaLongo(d.chave), `Pontualidade ${pctTexto(p)}`, ...resumoContagem(d.contagem)])
      })
      return el('div', {},
        el('div', { className: 'plot' }, ...grade, el('div', { className: 'colunas' }, ...colunas)),
        el('div', { className: 'plot' }, el('div', { className: 'eixo-x' }, ...dias.map((d, k) => el('span', { textContent: rotuloEixo(k, dias.length, passo) ? dataCurta(d.chave) : '' })))),
        menor && maior ? el('div', { className: 'nota-grafico', textContent: `Pior dia: ${nomeDia(menor.chave)} (${pctTexto(menor.contagem.pontualidadePct)}) · melhor: ${nomeDia(maior.chave)} (${pctTexto(maior.contagem.pontualidadePct)})` }) : null)
    }

    // Lista de barras horizontais (série única). `itens`: { rotulo, valor, texto, ativo, onClick, dica }.
    function listaBarras(itens, max) {
      return el('div', { className: 'lista-barras' }, ...itens.map(it => comDica(el('button', {
        className: 'barra-h', disabled: !it.onClick, 'aria-pressed': String(!!it.ativo), onClick: it.onClick || null,
        'aria-label': `${it.rotulo}: ${it.texto}`,
      }, el('span', { className: 'rot', textContent: it.rotulo }),
        el('span', { className: 'trilho' }, el('span', {}, el('i', { style: `width:${max ? Math.max(1, (100 * it.valor) / max) : 0}%` })), el('span', { className: 'val', textContent: it.texto }))),
      () => it.dica || [it.rotulo, it.texto])))
    }

    function graficoMotivos() {
      const ms = rel.porMotivo
      if (!ms.length) return el('div', { className: 'nota-grafico', textContent: 'Nenhum registro fora do horário no período — todos pontuais.' })
      const TOP = 6
      const itens = ms.slice(0, TOP).map(m => ({ rotulo: m.motivo, valor: m.total, texto: String(m.total), ativo: filtros.motivo === m.motivo, onClick: () => filtrarPor('motivo', m.motivo) }))
      const resto = ms.slice(TOP)
      if (resto.length) itens.push({ rotulo: `Outros (${resto.length})`, valor: resto.reduce((s, m) => s + m.total, 0), texto: String(resto.reduce((s, m) => s + m.total, 0)), dica: ['Outros motivos', ...resto.map(m => `${m.motivo}: ${m.total}`)] })
      return listaBarras(itens, ms[0].total)
    }

    function graficoRanking() {
      const cs = rel.colaboradores.filter(c => c.ocorrencias > 0)
      if (!cs.length) return el('div', { className: 'nota-grafico', textContent: 'Ninguém com atraso, divergência ou pendência no período.' })
      const TOP = 8
      const lista = listaBarras(cs.slice(0, TOP).map(c => ({
        rotulo: c.nome, valor: c.ocorrencias,
        texto: `${c.ocorrencias}${c.minutosAtraso ? ` · ${c.minutosAtraso} min` : ''}`,
        onClick: c.adm ? () => abrirColaborador(c.adm) : null,
        dica: [c.nome, `ADM ${c.adm || '?'}${c.setor ? ' · ' + c.setor : ''}`, plural(c.contagem.atraso, 'atraso', 'atrasos') + (c.minutosAtraso ? ` (${c.minutosAtraso} min além do previsto)` : ''),
          [c.contagem.divergente && plural(c.contagem.divergente, 'divergência', 'divergências'), c.contagem.pendente && plural(c.contagem.pendente, 'pendência', 'pendências')].filter(Boolean).join(' · ')],
      })), cs[0].ocorrencias)
      return el('div', {}, lista, cs.length > TOP ? el('div', { className: 'nota-grafico', textContent: `E mais ${plural(cs.length - TOP, 'colaborador', 'colaboradores')} com ocorrências — veja na tabela.` }) : null)
    }

    function graficoSetores() {
      return listaBarras(rel.porSetor.map(s => ({
        rotulo: s.chave, valor: s.contagem.pontualidadePct ?? 0, texto: pctTexto(s.contagem.pontualidadePct),
        ativo: filtros.setor === s.chave, onClick: s.chave === 'Sem setor' ? null : () => filtrarPor('setor', s.chave),
        dica: [s.chave, `Pontualidade ${pctTexto(s.contagem.pontualidadePct)}`, ...resumoContagem(s.contagem)],
      })), 100)
    }

    // ── detalhamento do colaborador (mesmo período da tela, ignora os outros filtros) ──
    let painelOrigem = null
    async function abrirColaborador(adm) {
      painelOrigem = document.activeElement
      const r = await ipc(() => window.agent.pontualidade(Object.fromEntries(Object.entries({ inicio: filtros.inicio, fim: filtros.fim, adm }).filter(([, v]) => v))))
      if (!r.ok) return toast(r.message)
      const regs = [...r.registros].sort((a, b) => a.data.localeCompare(b.data))
      const ult = regs[regs.length - 1]
      $('pNome').textContent = ult ? ult.nome : `ADM ${adm}`
      $('pSub').textContent = `ADM ${adm}${ult && ult.setor ? ' · ' + ult.setor : ''} · ${filtros.inicio || filtros.fim ? `${filtros.inicio ? dataCurta(filtros.inicio) : 'início'} a ${filtros.fim ? dataCurta(filtros.fim) : 'hoje'}` : 'todo o histórico'}`
      const c = r.contagem
      const mini = (rotulo, valor, detalhe) => el('div', {}, el('span', { textContent: rotulo }), el('b', { textContent: valor }), detalhe ? el('span', { textContent: detalhe }) : null)
      $('pCorpo').replaceChildren(
        el('div', { className: 'mini-kpis' },
          mini('Pontualidade', pctTexto(c.pontualidadePct)),
          mini('Atrasos', String(c.atraso), r.minutosAtraso ? `${r.minutosAtraso} min além do previsto` : ''),
          mini('Adiantados', String(c.adiantado)),
          mini('Ausências', String(c.ausencia), c.pendente ? plural(c.pendente, 'pendente', 'pendentes') : '')),
        el('section', { className: 'cartao' },
          el('div', { className: 'cabeca', style: 'margin-bottom:14px' }, el('div', {}, el('h2', { className: 'titulo-secao', textContent: 'Chegada × horário previsto' }), el('div', { className: 'sub', textContent: 'Minutos de diferença por dia. A linha tracejada é o limite da tolerância.' }))),
          graficoChegadas(regs)),
        el('section', { className: 'cartao' },
          el('h2', { className: 'titulo-secao', style: 'margin-bottom:10px', textContent: 'Histórico' }),
          tabelaHistorico([...regs].reverse())),
        el('div', {}, el('button', { className: 'btn pequeno', textContent: filtros.adm === adm ? 'Mostrar todos na tabela' : 'Filtrar a tabela por este colaborador', onClick: () => { fecharColaborador(); filtrarPor('adm', adm) } })))
      $('painelFundo').hidden = false
      $('pFechar').focus()
    }
    function fecharColaborador() {
      $('painelFundo').hidden = true
      $('dica').hidden = true
      if (painelOrigem && painelOrigem.focus) painelOrigem.focus()
    }
    $('pFechar').onclick = fecharColaborador
    $('painelFundo').addEventListener('click', e => { if (e.target === $('painelFundo')) fecharColaborador() })
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('painelFundo').hidden) fecharColaborador() })

    // Barras divergentes em torno do previsto (0): depois = laranja pra cima, antes = azul pra baixo.
    // Dia sem batida mostra o código (AT, F, FE…) no lugar da barra.
    function graficoChegadas(regs) {
      if (!regs.length) return el('div', { className: 'nota-grafico', textContent: 'Sem registros no período.' })
      const H = 160
      const difs = regs.map(r => r.diferencaMin).filter(d => d !== null)
      const tol = Math.max(0, ...regs.map(r => r.toleranciaMin ?? 0))
      const lim = Math.max(15, tol + 5, ...difs.map(Math.abs))
      const meio = H / 2, y = m => meio - (m / lim) * (meio - 4)
      const passo = Math.ceil(regs.length / 6)
      const grade = [[lim, `+${lim}`], [0, 'prev.'], [-lim, `−${lim}`]].map(([v, t]) => el('div', { className: 'grade' + (v === 0 ? ' base' : ''), style: `top:${y(v)}px` }, el('span', { textContent: t })))
      const colunas = regs.map(r => {
        const d = r.diferencaMin
        let marca
        if (d === null) marca = el('span', { className: 'cod', style: `top:${meio - 16}px`, textContent: r.codigo || '—' })
        else if (d >= 0) marca = el('i', { className: 'depois', style: `top:${y(d)}px;height:${Math.max(2, meio - y(d))}px` })
        else marca = el('i', { className: 'antes', style: `top:${meio}px;height:${Math.max(2, y(d) - meio)}px` })
        return comDica(el('button', { className: 'coluna', 'aria-label': `${diaLongo(r.data)}: ${r.entrada ? `chegou ${r.entrada}, previsto ${r.previsto}` : CLASSES[r.classe].rotulo}` }, marca),
          () => [diaLongo(r.data), r.entrada ? `Previsto ${r.previsto} · chegou ${r.entrada}` : (r.motivoCurto || 'Sem batida'), d === null ? '' : `${d > 0 ? '+' : d < 0 ? '−' : ''}${Math.abs(d)} min · ${CLASSES[r.classe].rotulo}`])
      })
      const limiteTol = tol ? el('div', { className: 'limite', style: `top:${y(tol)}px` }, el('span', { textContent: `tolerância ${tol} min` })) : null
      return el('div', { className: 'divergente-plot' },
        el('div', { className: 'plot' }, ...grade, limiteTol, el('div', { className: 'colunas' }, ...colunas)),
        el('div', { className: 'plot' }, el('div', { className: 'eixo-x' }, ...regs.map((r, k) => el('span', { textContent: rotuloEixo(k, regs.length, passo) ? dataCurta(r.data) : '' })))),
        el('div', { className: 'legenda-h' },
          el('span', {}, el('i', { style: 'background:#D4622A' }), 'Chegou depois do previsto'),
          el('span', {}, el('i', { style: 'background:var(--acao)' }), 'Chegou antes'),
          el('span', { className: 'ter', textContent: 'Código = dia sem batida (AT, F, FE…)' })))
    }

    // A "tabela" do gráfico acima: os mesmos valores, legíveis sem cor e sem mouse.
    function tabelaHistorico(regs) {
      const cols = COLUNAS.filter(c => ['data', 'previsto', 'entrada', 'diferencaMin', 'classe', 'motivoCurto'].includes(c[0]))
      return el('div', { className: 'rolagem' }, el('table', {},
        el('thead', {}, el('tr', {}, ...cols.map(c => el('th', { textContent: c[1] })))),
        el('tbody', {}, ...regs.map(r => el('tr', {}, ...cols.map(c => el('td', {}, c[3](r))))))))
    }

    // ── exportar ──
    async function exportar() {
      const r = await ipc(() => window.agent.exportarPontualidade(criterios()))
      if (r.cancelado) return
      if (!r.ok) return toast(r.message)
      toast(`${plural(r.linhas, 'registro exportado', 'registros exportados')}`, { rotulo: 'Mostrar arquivo', fn: () => window.agent.mostrarArquivo(r.arquivo) })
    }

    // Volta pra tela (ex.: depois de conferir um dia no Início) = dados novos.
    window.addEventListener('focus', () => carregar())
    aplicarPeriodo(periodo)
    carregar()
  </script>
</body>
</html>
